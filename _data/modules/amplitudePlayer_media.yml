description:
  title:                                amplitudePlayer
  scope:                                User media settings
  location:                             _data/modules/amplitudePlayer_media.yml

# ------------------------------------------------------------------------------
# MEDIA REFERENCES (key 'audio')
#
# The URL of a title is assembled from the album key 'audio_base' and the
# item key 'audio'. For LOCAL media files, the reference is the file name:
#
#   audio_base:   /assets/audio/album/emancipator
#   audio:        02_valhalla.mp3
#
# For YouTube titles, the reference is the video ID. BOTH formats below are
# supported, the SIMPLE format is recommended:
#
#   audio_base:   //youtube.com
#   audio:        HPWmY4am2oQ                 # SIMPLE format (recommended)
#   audio:        watch?v=HPWmY4am2oQ         # LEGACY format (still valid)
#
# A YouTube video ID consists of EXACTLY 11 characters out of the alphabet
# [A-Za-z0-9_-]. Note that an ID may START with a hyphen (e.g. -CQBzanq7dY);
# a lost leading hyphen makes the YouTube API answer with error 101|150,
# 'video not allowed'.
#
# An ABSOLUTE reference is taken as-is (the audio base is NOT prepended):
#
#   audio:        //youtube.com/watch?v=HPWmY4am2oQ
#
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# User settings
#
settings:

  # ----------------------------------------------------------------------------
  # MEDIA configuration
  #
  playlists:

    # --------------------------------------------------------------------------
    # Emancipator - Dusk to Dawn
    #
    - playlist:

      # ------------------------------------------------------------------------
      # GENERAL settings
      #
      enabled:                          true

      # ------------------------------------------------------------------------
      # PLAYLIST settings
      #
      name:                             emancipator

      # ------------------------------------------------------------------------
      # ALBUM settings
      # ------------------------------------------------------------------------
      album:                            &album_dusk_to_dawn

        playlist:                       emancipator
        name:                           Dusk to Dawn
        artist:                         Emancipator
        audio_base:                     /assets/audio/album/emancipator
        cover_image:                    /assets/audio/cover/emancipator/dusk_to_dawn.jpg
        audio_info:                     //emancipatormusic.com/
        audio_fade_in:                  true
        audio_fade_out:                 true
        repeat:                         false
        shuffle:                        false        

      # ------------------------------------------------------------------------
      # Playlist Items (Songs)
      #
      items:

