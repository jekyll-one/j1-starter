  scope:                                Default settings
  location:                             _data/defaults/gallery.yml

# ------------------------------------------------------------------------------
# Move/Merge comments in the default config #1
# This file is the ONE place where the J1 Gallery configuration is documented.
# The comments of the instance files
#
#   ~/_data/modules/gallery_control.yml   per-gallery configuration
#   ~/_data/modules/gallery_media.yml     per-gallery media content
#
# were moved here and consolidated: see the section "INSTANCE CONFIGURATION"
# at the end of this file. The instance files keep their data, short trailing
# markers (# override (default: x)), disabled (commented-out) keys and the
# deprecated values preserved for reference.
# ------------------------------------------------------------------------------

# ==============================================================================
# INSTANCE CONFIGURATION
# Move/Merge comments in the default config #1
# ------------------------------------------------------------------------------
# Consolidated documentation of the two instance files, moved here from
#
#   ~/_data/modules/gallery_control.yml   (I)  per-gallery CONFIGURATION
#   ~/_data/modules/gallery_media.yml     (M)  per-gallery MEDIA CONTENT
#
# Statements of the moved comments that had become wrong are corrected and
# marked "CORRECTED"; open points are listed under "OPEN POINTS" at the end.
# ==============================================================================
#
# ------------------------------------------------------------------------------
# 1. DATA FILES AND MERGE CHAIN
# ------------------------------------------------------------------------------
#   (split J1 Gallery data #1|#2, Fix J1 Gallery YAML data processing #1,
#    PhotoSwipeVideoPlugin plugin #4, Gallery modify drag-drop file
#    calculation errors #1)
#
#   The former single file gallery.yml was split into a control file (I) and
#   a media file (M), modeled on the Masonry scaffold (masonry_control.yml,
#   masonry_media.yml). Both use the same list structure
#
#     settings:
#       galleries:
#         - gallery:
#           id:           <unique id>      key of the ID-wise merge
#           ...
#
#   The include gallery.html (data file xhr_data_path/index.html) and the
#   adapter gallery.js build the EFFECTIVE settings of one gallery as a DEEP
#   merge (later layers overwrite PER KEY, missing keys fall through):
#
#     1. defaults        this file (defaults:)
#     2. user settings   (I) GLOBAL keys of settings (w/o galleries)
#     3. gallery         (I) settings.galleries[]        (matched by id)
#     4. media           (M) settings.galleries[]        (matched by id)
#
#   Rules that follow from it:
#
#   • DE-DUPLICATION. (I) states per-gallery OVERRIDES and NET-NEW keys only.
#     A value identical to the default is NOT restated: it is inherited. The
#     trailing markers in (I) say which kind a value is:
#       # override (default: x)   differs from this file
#       # net-new                 key not present in this file
#       # restated (default: x)   same as the default, kept for legibility
#       # opt-in                  switches on a feature that is off here
#     Removed as duplicates by the data split (fix 2): lightbox.enabled: true,
#     lightbox.type: lg, lightGallery.plugins "lgThumbnail, lgVideo",
#     lightGallery.options.licenseKey|download|alignThumbnails|animateThumb|
#     autoplayFirstVideo, gallery_options 150|1, filters.enabled: false,
#     videojsOptions.muted|preload|controls and the controlBar defaults.
#   • A PARTIAL subtree is safe (deep merge on every layer, also inside the
#     PhotoSwipe readers: _autoInitDeepMerge, deepMergeOptions). A YAML deep
#     merge can only ADD or REPLACE leaves, never REMOVE one -- which is why
#     e.g. videoAttributes.muted: false is given a deletion meaning by the
#     video plugin (see 4.).
#   • ARRAYS are replaced as a whole, never merged index-wise.
#   • The per-gallery 'enabled' gate is taken from the CONTROL chain
#     (layers 1-3) only. (M) states enabled: true on every entry; that value
#     is IGNORED and cannot switch on a gallery that (I) disables.
#   • (M) is not part of the option chain of the adapter: its payload
#     (images|videos) is rendered into the HTML data file only. After a
#     change of (I) or (M) the site has to be REBUILT (data file).
#
# ------------------------------------------------------------------------------
# 2. PER-GALLERY TOP-LEVEL KEYS (I)
# ------------------------------------------------------------------------------
#   enabled           true|false, the render|init gate (see 1.)
#   id                unique gallery id; the placeholder <div id="<id>">
#                     (asciidoc gallery:: macro) and all UI element ids
#                     <bare>_<id> and localStorage keys derive from it
#   type              image | video
#   video             video galleries: html5 | youtube
#   video_base_path   video galleries, html5: folder of the local video files
#                     (source of (M) is RELATIVE to it). Not used for youtube:
#                     those sources are stored absolute in (M).
#   thumb_base_path   informational only, read by neither the include nor
#                     the adapter (the poster base is image_base_url)
#
#   image_base_url    folder of the STATIC images|posters of (M). It has TWO
#                     consumers:
#                       1. gallery.html  href|src of every static image and
#                                        poster:  <image_base_url>/<file>
#                       2. drop area     <image_base_url>/<dropBasePath>/<file>
#                     RULE: image_base_url is the image FOLDER; dropBasePath
#                     is an OPTIONAL sub folder BELOW it for dropped files
#                     (null when they live in the same folder).
#                     An ORIGIN without a path (http://localhost:40000) for a
#                     gallery WITH static images renders <origin>/<file> ->
#                     404 for every entry and an EMPTY gallery (the former
#                     jgMegaCities defect); the adapter and the data file
#                     report that case. A hard-wired origin also breaks on
#                     any other host; prefer a site-rooted path.
#                     YouTube posters: //img.youtube.com/vi
#                     The older key image_base_path is still accepted as a
#                     fallback by gallery.html and gallery.js. Without both,
#                     dropped files map to dropBasePath ALONE (page-relative),
#                     see the join table at manage.dropBasePath above.
#
# ------------------------------------------------------------------------------
# 3. STORAGE | MANAGE | SEARCH PER GALLERY (I)
# ------------------------------------------------------------------------------
#   All keys are documented at storage|manage|search above; (I) only opts in.
#
#   • storage.enabled|manage.enabled are opt-in (Gallery, manage json data
#     to/from localstorage #1). PhotoSwipe galleries need no
#     storage.addClasses (PhotoSwipe binds all <a> children); a lightGallery
#     gallery that opts in should state  addClasses: [lg-item]  so entries
#     added by URL are bound.
#   • storage.preload applies to galleries with an EMPTY images key in (M)
#     ONLY (e.g. galleryManager). A gallery WITH static images logs
#     "storage.preload ignored ..." -- expected behaviour, not an error.
#     To drive such a gallery from a JSON file, empty its images key in (M).
#     Tip: build the gallery in the browser (paste URL | import), press
#     'Export Gallery' and save the download under the preload name.
#   • manage.showItemTools (rate|edit|delete on every tile) is OFF by
#     default and opted in per gallery. The delete tool and its confirmation
#     follow itemDelete|itemDeleteConfirm (defaults true).
#   • manage.dropSettingsMenu: the endpoint parts image_base_url and
#     dropBasePath can be changed at RUNTIME from the drop area menu
#     (three dots, top right); the change is kept per gallery in the browser
#     (dropSettingsPersist) until 'Reset'. Effective base in the console:
#       j1.adapter.gallery.getDropBasePath('<id>')
#   • manage.dropBasePath is RELATIVE to image_base_url (Gallery modify
#     drag-drop file calculation #1|#2; the join lives in the library). A
#     full URL starting with image_base_url still works, with a warning.
#     Keeping the image folder in BOTH keys doubles it in the endpoint.
#   • manage.listSource (default auto) gives managed galleries WITHOUT
#     storage.enabled -- e.g. the video gallery jg_video_html5_pswp -- a
#     working list screen and header count.
#   • manage.videoCategories offers an own Category list for VIDEO items,
#     e.g. [Animation, Movies, Music]; the edit tool opens 'Edit Media
#     Settings' in video mode (Video Link | Poster Image | Video Size).
#
# ------------------------------------------------------------------------------
# 4. LIGHTBOX PER GALLERY (I)
# ------------------------------------------------------------------------------
#   lightbox.type     ps (PhotoSwipe) | lb | lg (lightGallery, default)
#                     Only the override is stated; enabled: true inherits.
#
#   The PhotoSwipe and the lightGallery path read DIFFERENT subtrees. Keys of
#   the other path are inert (merged, never serialised):
#
#     lightbox.type: lg   lightGallery.plugins|options|videojsOptions|
#                         playerParams
#     lightbox.type: ps   photoswipe.* -- serialised by gallery.html into the
#                         container attributes data-pswp-video-options,
#                         -fullscreen, -fullscreen-options, -caption,
#                         -caption-options (all '| jsonify | escape', so an
#                         apostrophe in a value is safe)
#
#   Mapping of the lightGallery keys to their PhotoSwipe equivalents:
#
#     playerParams.autoplay: 1   ->  photoswipe.videoOptions.autoplay
#     playerParams.mute: 0       ->  videoAttributes.muted: false
#     videojsOptions.enabled     ->  photoswipe.videoOptions.videojs.enabled
#     videojsOptions.tracks      ->  photoswipe.videoOptions.tracks
#     hotKeysPlugin|controlBar.skipButtonsPlugin|controlBar.zoomPlugin
#                                ->  videojs.plugins.hotKeys|skipButtons|
#                                    zoomButtons (keyed by the player METHOD)
#
#   LIGHTGALLERY VIDEO GALLERIES
#   ----------------------------------------------------------------------------
#   lightGallery.options.videojs: true    VideoJS renderer (default: false)
#   lightGallery.options.videojsTheme     net-new, e.g. vjs-theme-uno
#   lightGallery.videojsOptions:
#     enabled: true                       switch the block on (default: false)
#     tracks: true                        net-new
#     hotKeysPlugin                       net-new PLACEMENT at the top level
#                                         (this file: controlBar.hotkeysPlugin)
#     controlBar.skipButtonsPlugin.options.backwardIndex|forwardIndex
#                                         net-new, button positions
#     controlBar.zoomPlugin.showZoom|showMove|showRotate|gestureHandler
#                                         net-new
#   lightGallery.playerParams             net-new block for YouTube embeds:
#                                         autoplay: 1 works only when muted
#                                         (mute default = 1)
#   lightGallery.options.addClass: lg-uno-thumbnails with
#   appendThumbnailsTo: .lg-outer and allowMediaOverlap: true
#                                         customized thumbnails (all three
#                                         are required together)
#
# ------------------------------------------------------------------------------
# 5. PHOTOSWIPE PER GALLERY (I)
# ------------------------------------------------------------------------------
#   PREREQUISITES (outside the YAML)
#     • video.min.js, plus videojs-youtube.min.js for YouTube galleries; the
#       plugin warns once and degrades without them.
#     • photoswipe-fullscreen-plugin.js for plugin.fullscreen (warns once).
#     • videoFilters.js|.css with the videojs resource for
#       videojs.plugins.videoFilters.
#     • The former prerequisite "plugin.video: true in defaults/
#       photoswipe.yml" is SUPERSEDED (PhotoSwipeVideoPlugin plugin #12):
#       the video plugin is opted in PER GALLERY, see videoOptions.enabled.
#       Setting the site-wide key would attach the plugin to the image
#       galleries as well.
#
#   auto_detect_size                false | missing | true | always, level 2
#                                   of the natural-size detection (see
#                                   photoswipe.auto_detect_size above)
#
#   plugin.fullscreen               full-screen button for THIS gallery,
#                                   level 1 of the resolution order. THREE
#                                   states:
#                                     true    button, whatever the site says
#                                     false   no button, whatever the site says
#                                     absent  fullscreenOptions.enabled, then
#                                             the site-wide plugin.fullscreen
#                                             of defaults/photoswipe.yml
#                                   To opt out set false; deleting the line
#                                   is the third state, not the same thing.
#                                   The button puts the PhotoSwipe ROOT into
#                                   full screen, not the <video>: the VideoJS
#                                   (or YouTube iframe) full-screen control
#                                   is separate; they nest, not conflict. A
#                                   muted autostart is not re-decided when
#                                   full screen is entered.
#   plugin.caption                  same three states for the caption plugin
#
#   captionOptions                  merged OVER the site-wide captionOptions
#                                   of photoswipe.yml for this gallery:
#     type                          below (J1 default) | aside | auto (with
#                                   autoAllowAside: true)
#     portraitPadding               extra space above|below PORTRAIT slides:
#                                   25 | '25px' | { top: 40, bottom: 20 } |
#                                   0 (off). Only visible where the image
#                                   fills the height (PhotoSwipe never scales
#                                   a smaller image up).
#
#   fullscreenOptions               merged over autoInitFullscreenDefaults
#                                   (shallow, the option set is flat):
#     enabled                       same switch as plugin.fullscreen, one
#                                   level down; state ONE of the two
#     fullscreenTitle               tooltip|aria title of the button,
#                                   default 'Toggle fullscreen'
#     fullscreenOnDoubleTap         true|false, default false (opt-in).
#                                   Double click|tap toggles full screen.
#                                   Cost: a touch double tap no longer zooms
#                                   (pinch still does); every single mouse
#                                   click runs doubleClickDelay ms later.
#                                   Needs an active button and the browser
#                                   Fullscreen API.
#     doubleClickDelay              ms, 0..2000, default 300
#     doubleTapExclude              CSS selector; REPLACES the default list
#                                   (VideoJS controls, buttons, links, fields)
#                                   NOTE: the PhotoSwipe option
#                                   doubleTapAction: false (photoswipe.yml or
#                                   data-pswp-options) switches PhotoSwipe's
#                                   double-tap DETECTION off, so the touch
#                                   gesture does nothing; the mouse double
#                                   click keeps working.
#                                   CORRECTED: a note on jg_video_youtube_pswp
#                                   claimed a gallery without fullscreenOptions
#                                   "inherits the module-wide block of
#                                   defaults/gallery.yml" with double tap ON.
#                                   This file states NO fullscreenOptions
#                                   block, so nothing is inherited from here;
#                                   the plugin defaults apply (double tap off).
#
#   videoOptions                    merged over photoswipe.videoOptions above
#     enabled                       true = video plugin for this gallery
#                                   (default false). REQUIRED for every
#                                   PhotoSwipe video gallery, else every slide
#                                   is loaded as an IMAGE (black frame) and
#                                   the videojs block is never reached.
#     autoplay                      startOnFirst (default) | startOnAll |
#                                   true (= startOnAll) | false. Restating
#                                   the old 'true' would silently turn a
#                                   restatement into an override.
#     videoAttributes.muted: false  OMITS the attribute (boolean attributes
#                                   are presence-based; muted="false" would
#                                   still mute). Turns the gallery into an
#                                   UN-MUTED autostart.
#                                   html5 (same-document <video>): permitted,
#                                   the click on the thumbnail is sticky user
#                                   activation. A visitor who never clicked
#                                   (deep link, test) gets the poster plus one
#                                   console warning.
#                                   youtube (CROSS-ORIGIN iframe): REFUSED --
#                                   the embed applies its own policy and does
#                                   not see the click; the refusal is silent.
#                                   autoplayMutedFallback (default true) mutes
#                                   and retries once, so the slide starts
#                                   silently; read muted: false there as
#                                   "un-muted where the browser permits it".
#     preventDragOffset             56 for YouTube galleries (default 40):
#                                   the YouTube control bar inside the iframe
#                                   sits lower, a narrower strip lets a drag
#                                   on it swipe the slide
#     videojs.plugins               partial overrides of the plugin block
#                                   above, e.g. skipButtons.options.forward|
#                                   backward: 5. zoomButtons is ignored for
#                                   YouTube slides.
#     videojs.plugins.videoFilters  net-new: brightness|contrast|saturation
#                                   (Fix videoFilters plugin für VideoJS #1|#2)
#       enabled                     true = activated after zoomButtons
#                                   (plugin default false)
#       options                     handed to player.videoFilters() as-is,
#                                   full list: videojs.yml,
#                                   settings.plugins.videoFilters
#       options.persist.scope|key   player + a FIXED key (the gallery id):
#                                   lightbox players are created at runtime
#                                   with unstable ids, one record per gallery
#                                   finds its values on every slide and visit.
#                                   A YouTube tech is skipped by the plugin
#                                   itself (option techs).
#
# ------------------------------------------------------------------------------
# 6. MEDIA CONTENT (M)
# ------------------------------------------------------------------------------
#   images (image galleries)        one entry per image; EMPTY on purpose for
#                                   galleries filled from JSON|localStorage
#     file                          file name below image_base_url
#     width|height                  natural size -> data-pswp-width|height;
#                                   'auto-detect' requests a measurement
#                                   (level 1 of auto_detect_size)
#     caption_text                  alt|aria-label|tile caption (HTML entities
#                                   allowed, e.g. &middot;)
#     description                   lightbox caption (HTML, data-sub-html)
#
#   videos (video galleries)
#     enabled                       per video
#     name                          used in the share texts
#     type                          html5 | youtube
#                                   -> data-pswp-video-provider
#     api                           videojs | iframe | native
#                                   -> data-pswp-video-api; videojs is
#                                   REQUIRED for YouTube on PhotoSwipe (a bare
#                                   <video> cannot load a YouTube URL)
#     size                          "1280-720" -> data-pswp-width|height and
#                                   data-lg-size; missing|malformed falls back
#                                   to 1280x720; 'auto-detect' = measure
#     source                        html5: file below video_base_path;
#                                   youtube: //youtube.com/watch?v=<id>
#                                   -> data-pswp-video-src and the anchor href
#     poster_image                  file below image_base_url (YouTube:
#                                   <id>/maxresdefault.jpg | mqdefault.jpg);
#                                   PhotoSwipe reads it as msrc, the plugin
#                                   hands it to the player as poster
#     pinterest_prefix|tweet_prefix share text prefixes
#     caption_text|description      as for images
#     tracks                        text tracks (captions, chapters, ...):
#                                   lightGallery: data-video JSON;
#                                   PhotoSwipe: data-pswp-video-tracks (emitted
#                                   only for a NON-EMPTY list, switched by
#                                   photoswipe.videoOptions.tracks)
#       - track:                    list-style marker, ignored by the readers
#         default                   enable the track unless the user's
#                                   preferences select another one
#         kind                      captions | subtitles | chapters | ...
#         srclang                   language code of the track, e.g. en
#         label                     name shown in the player menu
#         src                       path of the .vtt file
#     playerParams.start            lightGallery|YouTube-iframe only, seconds
#                                   to start at; no PhotoSwipe equivalent
#
#   The media SHAPE is the same for both lightboxes: switching a gallery
#   between lg and ps is a one-line change of lightbox.type in (I).
#
# ------------------------------------------------------------------------------
# 7. SHIPPED GALLERIES
# ------------------------------------------------------------------------------
#   galleryManager           image, ps, manage UI, empty images (JSON|store)
#   jg_old_times             image, ps, storage + manage (disabled)
#   jgMegaCities             image, ps, storage, 10 static images
#   jg_video_html5           video html5, lightGallery + VideoJS
#   jg_video_html5_videojs   video html5, lightGallery + VideoJS (disabled)
#   tdc_latin                video youtube, lightGallery (disabled)
#   jg_video_html5_pswp      video html5, PhotoSwipe, un-muted autostart,
#                            manage UI, videoFilters
#   tdc_latin_pswp           video youtube, PhotoSwipe (disabled)
#   jg_video_youtube_pswp    video youtube, PhotoSwipe, fallback to muted
#                            autostart (disabled)
#   (M) also carries jg_video_youtube_james_and_adele (disabled, its two
#   videos commented out) without a control entry: it is never rendered.
#
# ------------------------------------------------------------------------------
# 8. OPEN POINTS (flagged, data NOT changed)
# ------------------------------------------------------------------------------
#   a) (M) jg_video_html5, video 2: 'tracks::' (double colon) is a key named
#      "tracks:", so video.tracks is nil there. Harmless (the list is empty),
#      but the intended spelling is 'tracks: []'.
#   b) (I) jgMegaCities: manage.dropBasePath: none is the STRING 'none', a
#      sub folder named none (<base>/none/<file>), not "no sub path". The
#      moved comment asks for null. Inactive today (manage.enabled: false).
#   c) (I) galleryManager: search.type: simpleSearch is read by nobody
#      (the library knows no search types).
#   d) (I) jg_video_html5_pswp: a commented-out 'playerParams' block sits
#      below the photoswipe subtree, a lightGallery key with no effect on
#      the PhotoSwipe path; kept as disabled content.
#   e) jg_video_youtube_pswp (M): the description of video 2 reads
#      "Carpool Karaoke 2023" for a Tiny Desk Concert entry.
# ==============================================================================

# ------------------------------------------------------------------------------
# User configuration settings
#
defaults:

  # ----------------------------------------------------------------------------
  # GENERAL gallery settings
  #
  # enabled
  # ----------------------------------------------------------------------------
  #   Enables|Disables the use of a gallery
  #
  # xhr_data_path
  # ----------------------------------------------------------------------------
  # The HTML portion of a grid are being read from a HTML file generated
  # automatically from its configuration for all galleries configured.
  # AJAX methods are used to supply the needed HTML code at the time
  # a gallery is initialized by the JS adapter.
  #
  #   values:                           string
  #   default:                          /assets/data/gallery
  #
  # ----------------------------------------------------------------------------
  #
  enabled:                              false                                   # needed for j1.layout_shim_generator.html

  # ----------------------------------------------------------------------------
  # Global settings
  #
  xhr_data_path:                        /assets/data/gallery
  gallery_complete_timeout:             1000

  # ----------------------------------------------------------------------------
  # JSON data store (localStorage) + manage bar
  #
  # Two NET-NEW subtrees. Both are handed to the library justifiedGallery.js
  # by the adapter (gallery.js, initGallery()) as the options "storage" and
  # "manage" of the justifiedGallery() call, resolved through the normal
  # per-gallery chain (defaults <- control <- gallery entry, deep). Both are
  # OFF here so no gallery changes behaviour until it opts in by name in
  # ~/_data/modules/gallery_control.yml.
  #
  # The feature mirrors the J1 MultiPlayer: the player keeps its playlist as
  # JSON records in localStorage and offers a header bar (toggle list | title
  # | edit) plus an edit screen (paste URL, import from server, export |
  # import | clear). The gallery gets the same for its ENTRIES.
  #
  # storage
  # ----------------------------------------------------------------------------
  #   enabled           export the gallery entries as JSON items to localStorage
  #                     (key 'jg_gallery_<id>') on every completed layout
  #                     ('jg.complete'). Each item carries href, thumb, alt,
  #                     width|height, caption, classes, all data-* attributes
  #                     and the extra inner markup (caption spans, play button)
  #                     so lightGallery and PhotoSwipe entries round-trip.
  #   key               localStorage key; null = 'jg_gallery_<id>'
  #   exportOnComplete  false = never write automatically (on demand only:
  #                     $('#id').justifiedGallery('storeExport'))
  #   autoRestore       a store the USER changed (import|add|delete) replaces
  #                     the static entries of the data file on the next page
  #                     load — the persistence the MultiPlayer playlist has.
  #                     An untouched store (meta_data.modified: false) never
  #                     wins over the static HTML; it is simply rewritten.
  #                     Set false to keep the data file authoritative always.
  #                     Fix render for empty Gallery from localstorage #1
  #                     autoRestore applies to EVERY gallery that has a
  #                     store, i.e. storage.enabled OR manage.enabled
  #                     (manage-only galleries included). A gallery WITHOUT
  #                     static entries (empty 'images' key) renders the
  #                     stored items on load even if the store is untouched
  #                     (modified: false), and its empty layout never
  #                     overwrites the stored items.
  #   mergeMode         import: true = merge by itemId into the existing items,
  #                     false = replace the item set
  #   reloadOnClear     'Clear Gallery' removes the key (after a safety backup
  #                     download) and reloads the page so the gallery is
  #                     rebuilt from the data file
  #   addClasses        classes given to entries ADDED BY URL through the edit
  #                     screen; lightGallery galleries need 'lg-item' here (the
  #                     selector the adapter binds), PhotoSwipe galleries need
  #                     nothing (children selector 'a')
  #
  #   preload           list of JSON item files merged into the store on every
  #                     page load — the counterpart of `playlist.preload` of
  #                     the J1 MultiPlayer (multiPlayer_control.yml, Player 6).
  #                     Applies to galleries WITHOUT static entries (empty
  #                     'images' key in gallery_media.yml) only; a gallery with
  #                     entries skips it with a console warning. The merge is
  #                     by itemId, never overwrites, never duplicates, so the
  #                     list can stay in the configuration permanently. User
  #                     additions survive; an item the user deleted returns on
  #                     the next load while its file is still listed, and
  #                     'Clear Gallery' re-seeds from the files after the
  #                     reload. Accepted file shapes: a bare item array or the
  #                     { meta_data, items } file written by 'Export Gallery'
  #                     (build the gallery in the browser, export, drop the
  #                     file into the preload folder).
  #                     values: [ name.json, /abs/path.json, https://... ]
  #                     Move/Merge comments in the default config #1
  #                     a single name (string) is accepted as well; false
  #                     or [] = no preload.
  #                     default: false
  #   preloadUrlBase    folder for RELATIVE preload names; null = manage.listUrlBase,
  #                     then /assets/data/apps/multiGallery/playlists/lists.
  #                     Names starting with '/' or http(s):// are used as they are.
  #
  # manage
  # ----------------------------------------------------------------------------
  #   enabled           build the header bar + list screen + edit screen around
  #                     the gallery element (runtime, inside #<id>_parent; the
  #                     generated data file is NOT touched, no rebuild needed).
  #                     The store is created with the UI; the automatic export
  #                     stays governed by storage.enabled.
  #   title             header title; null = the gallery id
  #   showCount         append the stored item count to the title: "Title (12)"
  #   showListButton    left header button: toggle the item list (thumbnail,
  #                     caption, size, source, per-item delete)
  #   editButton        right header button: toggle the editor
  #   listDeleteButton  per-item delete button in the list screen
  #
  #   listUrl           index file of the server-side galleries offered by the
  #                     import <select> of the editor (#serverGallerySelect_<id>),
  #                     shape [{ "name": "Mega Cities", "file": "mega-cities.json" }]
  #                     — the shape of the MultiPlayer playlist index.
  #                     null  = <listUrlBase>/index.json
  #                     (default; same convention as the MultiPlayer, which
  #                     always reads <playlists>/index.json)
  #                     false = no index, the select stays at its placeholder
  #                     Selecting an entry and pressing 'Import' loads the
  #                     JSON item file into the gallery (replace, or merge
  #                     by itemId with storage.mergeMode: true); the loaded
  #                     set survives a reload. Item files have the shapes of
  #                     an import: a bare item array or a file written by
  #                     'Export Gallery'.
  #   listUrlBase       base path for RELATIVE files of that index and for the
  #                     default index file; null = storage.preloadUrlBase,
  #                     then /assets/data/apps/multiGallery/playlists/lists
  #
  #                     Load Gallery from browser select #3
  #                     A RELATIVE listUrl (a bare file name like index.json)
  #                     is resolved against the list base, like the 'file'
  #                     entries of the index — it is NOT a page-relative URL.
  #                     Names starting with '/' or http(s):// are used as
  #                     they are. Default of both keys: null, so the select
  #                     reads the folder of the preload files:
  #                     /assets/data/apps/multiGallery/playlists/lists/index.json
  #
  #                     Move/Merge comments in the default config #1
  #                     The SHIPPED values below are listUrl: index.json and
  #                     listUrlBase: /assets/data/apps/multiGallery/playlists/
  #                     lists, which resolve to the same index file as the
  #                     null defaults of the library.
  #   screenMinHeight   min height (px) of the two overlay screens
  #                     Gallery set heigth for manage screens #1
  #                     superseded by manageScreenHeight; kept for reference,
  #                     no longer read by the library
  #
  #   manageScreenHeight
  #                     FIXED height of BOTH manage screens (list | edit).
  #                     While a screen is open the gallery element itself
  #                     (e.g. id="multiGallery") is hidden; the screen sits
  #                     directly below the manage bar and content taller
  #                     than this height scrolls inside the screen (y).
  #                     A number is taken as px; a string may carry the units
  #                     px, rem, em, vh, vw, svh, dvh, lvh. Percent values are
  #                     NOT supported (the wrapper height is derived from the
  #                     screen height). Invalid values fall back to the
  #                     default with a console warning.
  #                     Move/Merge comments in the default config #1
  #                     The NOTE below is wrong and was corrected: the key
  #                     read by the library (_manageScreenHeight()) is
  #                     'manageScreenHeight', default 535px (library, CSS
  #                     and the value below agree).
  #                     values: 430px | 430 | 27rem | 60vh ...
  #                     default: 535px
  #                     Original (deprecated, preserved for reference):
  #                     NOTE: the key name is spelled 'Heigth' as specified;
  #                     a key 'manageScreenHeight' is NOT read.
  #                     values: 430px | 430 | 27rem | 60vh ...
  #                     default: 430px
  #   icons             override the four header icons by name
  #                     (playlist-show, playlist-hide, playlist-edit,
  #                     playlist-edit-close); default: the MultiPlayer set
  #                     /assets/theme/j1/modules/multiPlayer/icons/player/dark
  #
  #   itemRating        star button per gallery item (list rows + tiles):
  #                     opens the 'Set Media Rating' dialog (1..5 stars),
  #                     the rating is stored with the item (field 'rating')
  #   itemEdit          edit button per gallery item (list rows + tiles):
  #                     opens the 'Edit Media Settings' dialog (Category,
  #                     Title, Description, Info Link, Image Link, Thumbnail,
  #                     Issue Date, Tags). A Title is shown as the caption
  #                     of the tile; empty = the original caption.
  #   tileButtons       show the two buttons as an overlay on every gallery
  #                     tile (on hover|focus, always on touch devices), so
  #                     the dialogs work for ALL items of the gallery —
  #                     also before the list holds any stored item
  #                     Gallery add edit media settings dialog #2
  #                     superseded by showItemTools; kept for reference,
  #                     no longer read by the library
  #
  #   showItemTools     show the item tools (the rate|edit buttons, element
  #                     span.jg-item-tools) as an overlay on every gallery
  #                     tile (on hover|focus, always on touch devices).
  #                     Set it per gallery in gallery_control.yml (manage
  #                     subtree) to opt in. The buttons in the rows of the
  #                     list screen are NOT affected (itemRating|itemEdit).
  #                     Needs manage.enabled: true.
  #                     values: true | false
  #                     default: false (disabled)
  #   Gallery add edit media settings dialog #5
  #   itemDelete        delete tool ('Remove item', trash icon) in the item
  #                     tools of every tile, next to rate|edit; removes the
  #                     item from the gallery (store + page). Shown only
  #                     where showItemTools is true. The delete button in
  #                     the rows of the list screen is NOT affected
  #                     (listDeleteButton).
  #                     values: true | false
  #                     default: true
  #   itemDeleteConfirm ask before removing (dialog 'Remove Media Item' with
  #                     thumbnail, Cancel | Remove); false = remove at once.
  #                     Removing marks the store as user-modified, so
  #                     (autoRestore) the item stays removed after a reload;
  #                     'Clear Gallery' brings the data file back.
  #                     values: true | false
  #                     default: true
  #
  #   categories        options of the Category select of the edit dialog;
  #                     null = built-in list (Animals, Architecture, Art,
  #                     Events, Family, Food, Landscape, Nature, People,
  #                     Sports, Technology, Travel, Vehicles)
  #                     Both dialogs need manage.enabled: true. Saving a
  #                     rating|setting marks the store as user-modified, so
  #                     (autoRestore) the stored items own the gallery from
  #                     the next page load on — like an add|delete.
  #
  #   Gallery add edit media settings dialog for video #1
  #   The edit dialog serves VIDEO items as well (e.g. jg_video_html5_pswp).
  #   For a video item it shows 'Video Link' (local file mp4|webm|ogg|mov|
  #   m3u8 or a YouTube link), 'Poster Image' and the video-only field
  #   'Video Size' (width-height, e.g. 1280-720) instead of 'Image Link' and
  #   'Thumbnail'. A changed link|poster|size is written into the attributes
  #   the lightbox players read (PhotoSwipe and lightGallery markup).
  #
  #   videoCategories   options of the Category select for VIDEO items;
  #                     null = built-in list (Animation, Comedy, Concert,
  #                     Documentary, Education, Events, Family, Gaming,
  #                     Movies, Music, Nature, News, Sports, Technology,
  #                     Travel). Image items keep 'categories'.
  #                     values: null | [ list of names ]
  #                     default: null
  #
  #   Gallery add edit media drag-drop area #1
  #   DROP AREA of the edit screen: the frame around the Paste | image link
  #   bar takes image FILES (also several at once), whole FOLDERS and image
  #   LINKS dragged from another page; 'browse ...' opens a multi-select
  #   file picker. Files from a LOCAL disk are not part of the web space:
  #   they are mapped by name below the image base path of the gallery
  #   (image_base_url in gallery_control.yml) and probed before they are
  #   added — a file the web server does not serve there is reported.
  #
  #   dropArea          turn the frame into a drop area
  #                     values: true | false
  #                     default: true
  #                     Move/Merge comments in the default config #1
  #                     Since drag-drop area #2 the drop area is an OWN
  #                     section ABOVE the Paste | image link bar; false
  #                     omits the whole drop section.
  #   dropBasePath      web path dropped LOCAL files are mapped to;
  #                     null  = image_base_url of the gallery
  #                     false = no mapping (only links, or dropFallback)
  #                     default: null
  #
  #                     Gallery modify drag-drop file calculation #1
  #                     dropBasePath is a SUB PATH below image_base_url,
  #                     no longer an alternative to it. Endpoint:
  #                       <image_base_url>/<dropBasePath>/[<folder>/]<file>
  #                     e.g. http://localhost:11000 + image_sets/sisters
  #                       -> http://localhost:11000/image_sets/sisters/<file>
  #                     A leading '/' is a separator (still below the base).
  #                     A full path that already starts with image_base_url,
  #                     or an absolute URL of another host, is used as-is
  #                     (console warning). No image_base_url: dropBasePath
  #                     alone. Resolved by the adapter gallery.js
  #                     (_resolveDropBasePath()).
  #
  #                     Gallery modify drag-drop file calculation #2
  #                     "Resolved by the adapter" above no longer holds:
  #                     the library justifiedGallery.js joins the two
  #                     itself (_jgResolveDropBase(), called by
  #                     ioHandler._dropBasePath()), so the rule also holds
  #                     for a justifiedGallery() call made without the
  #                     adapter. The adapter passes manage{} unchanged.
  #                     Check: j1.adapter.gallery.getDropBasePath('<id>')
  #   dropKeepFolders   a dropped FOLDER keeps its folder name in the path:
  #                     <base>/<folder>/<file>; false: <base>/<file>
  #                     default: true
  #   dropMaxFiles      max image files per drop; 0 = unlimited
  #                     default: 100
  #   dropFallback      a file NOT found below the base path:
  #                     none    = skip it (reported in the status line)
  #                     dataUrl = embed the image itself (data: URL) in the
  #                               stored item — localStorage holds ~5 MB
  #                               per site, use for small images only
  #                     default: none
  #   dropMaxDataUrlSize
  #                     max file size (bytes) embedded by dropFallback dataUrl
  #                     default: 262144 (256 KB)
  #                     Move/Merge comments in the default config #1
  #                     262144 is the LIBRARY default; this file ships
  #                     100000 (~100 KB), which is what every gallery inherits.
  #   dropCloseOnSuccess
  #                     close the editor after a drop that added items
  #                     without failures (else it stays open and shows
  #                     the result)
  #                     default: true
  #
  #   Gallery add edit media drag-drop area #3
  #   RUNTIME MENU of the drop section: a toggle button at the top right of
  #   the drop area (three dots) opens a small menu to CHANGE the two parts
  #   of the file endpoint for the current gallery while the page is open:
  #
  #     <image_base_url>/<dropBasePath>/[<folder>/]<file>
  #
  #   The values of gallery_control.yml are not changed; 'Reset' in the
  #   menu returns to them. A changed base is marked 'runtime' in the info
  #   line of the drop area.
  #
  #   dropSettingsMenu  show the toggle button and the menu
  #                     values: true | false
  #                     default: true
  #                     Move/Merge comments in the default config #1
  #                     true is the LIBRARY default; this file ships false,
  #                     so a gallery opts in with dropSettingsMenu: true
  #                     (galleryManager, jgMegaCities, jg_video_html5_pswp do).
  #   dropSettingsPersist
  #                     remember the changed values per gallery in the
  #                     browser (localStorage 'jg_dropbase_<id>') and use
  #                     them again on the next page load; false = the
  #                     change lasts for the current page view only
  #                     values: true | false
  #                     default: true
  #
  #   Gallery add edit media settings dialog for video #2
  #   LIST SCREEN for galleries WITHOUT storage.enabled (e.g. the video
  #   gallery jg_video_html5_pswp): the list screen and the item count of the
  #   manage bar read the store ONLY, which such a gallery fills only after a
  #   user change -- the list toggle stayed disabled ("Local Video (0)").
  #
  #   listSource        source of the list screen and of the header count
  #                     auto  = the stored items, else the gallery entries
  #                             (DOM) -- the list works for every managed
  #                             gallery, video galleries included
  #                     store = the stored items only (behaviour before)
  #                     dom   = the gallery entries only
  #                     values: auto | store | dom
  #                     default: auto
  #
  #   values:           see above
  #   default:          storage.enabled false, manage.enabled false
  #
  # ----------------------------------------------------------------------------
  #
  storage:
    enabled:                            false

    key:                                null
    exportOnComplete:                   true
    autoRestore:                        true
    mergeMode:                          false
    reloadOnClear:                      true
    addClasses:                         []
    preload:                            false
    preloadUrlBase:                     /assets/data/apps/multiGallery/playlists/lists

  manage:
    enabled:                            false

    autoOpenEditor:                     true                                    # open the edit screen automatically while the gallery has no items
    title:                              null
    showCount:                          true
    showListButton:                     true
    editButton:                         true
    listDeleteButton:                   true
    listUrl:                            000_index.json
    listUrlBase:                        /assets/data/apps/multiGallery/playlists/lists
    screenMinHeight:                    320
    manageScreenHeight:                 535px
    itemRating:                         true
    itemEdit:                           true
    showItemTools:                      false                                   # hide|show rate andedit buttons (item tools) on every gallery tile
    itemDelete:                         true                                    # delete tool (trash) in the item tools of every tile
    itemDeleteConfirm:                  true                                    # ask before removing an item ('Remove Media Item')
    categories:                         null
    videoCategories:                    null                                    # Category options for VIDEO items (null: built-in video list)
    dropArea:                           true                                    # enable|disable the drop area
    dropBasePath:                       null                                    # image path , default: image_base_url
    dropKeepFolders:                    true                                    # folder drop: <base>/<folder>/<file>
    dropMaxFiles:                       100                                     # max numer of files to import
    dropFallback:                       none                                    # none | dataUrl
    dropMaxDataUrlSize:                 100000
    dropCloseOnSuccess:                 true
    dropSettingsMenu:                   false                                   # toggle menu (top right) to change image_base_url|dropBasePath at runtime
    dropSettingsPersist:                true                                    # keep the runtime values per gallery (localStorage)
    listSource:                         auto                                    # auto | store | dom: source of the list screen + header count
    icons:                              {}

  # ----------------------------------------------------------------------------
  # SEARCH settings
  #
  search:
    enabled:                            false
    placeholder:                        Search the gallery for items by title, description, category, type, or tag
    sort:                               true
    sortOptions:                        null                                    # null = all: none, addDate, addDateAsc, issueDate, issueDateAsc, title, category, description, rating, type
    defaultSort:                        none
    rememberSort:                       true
    showCount:                          true
    debounce:                           300

  # ----------------------------------------------------------------------------
  # CSSFilter settings
  #
  filters:
    enabled:                            false
    grayscale:                          1
    contrast:                           0.8
    brightness:                         0.4

  # ----------------------------------------------------------------------------
  # justifiedGallery settings
  #
  gallery_options:
    rowHeight:                          150
    gutters:                            1

  # ----------------------------------------------------------------------------
  # Lightbox settings
  #
  lightbox:
    enabled:                            true
    type:                               lg                                      # ps | lb | lg

  # ----------------------------------------------------------------------------
  # PhotoSwipe settings
  #
  # muted
  # ----------------------------------------------------------------------------
  #   The key that makes `autoplay` actually work. Browsers refuse to start an
  #   un-muted video the visitor has not interacted with; without this the
  #   plugin's autoplay attempt is rejected and the visitor gets a poster plus
  #   one console warning. An EMPTY STRING writes a bare boolean attribute
  #   (<video muted>), which is the only spelling HTML accepts.
  #
  #   Remove it (or set `autoplay: false`) if videos should wait for a click.
  #
  # videojs
  # ----------------------------------------------------------------------------
  #   Selects the VideoJS renderer for slides marked
  #   `data-pswp-video-api="videojs"`, which gallery.html derives from the
  #   per-video `api:` key in gallery_media.yml. Required for YouTube sources:
  #   a bare <video> element cannot load a YouTube URL.
  #
  #   `theme` is appended to the generated <video class="video-js ...">, and
  #   matches the theme the Asciidoctor extension videojs-block.rb defaults to.
  #
  #   values:                           enabled: boolean, theme: CSS class
  #   default:                          true / vjs-theme-uno
  #
  # ----------------------------------------------------------------------------
  #
  # tracks
  # ----------------------------------------------------------------------------
  #   Master switch for text tracks (subtitles, captions, chapters) on the
  #   PhotoSwipe path, the counterpart of `videojsOptions.tracks` on the
  #   lightGallery path. gallery.html hands the per-video `tracks:` list of
  #   gallery_media.yml to the slide as `data-pswp-video-tracks` (JSON);
  #   the plugin attaches them as <track> children (bare <video>) or via
  #   addRemoteTextTrack() (VideoJS). `false` ignores the attribute.
  #
  #   values:                           boolean (false|true)
  #   default:                          true
  #
  # videojs.options / videojs.plugins / videojs.customProgressBar
  # ----------------------------------------------------------------------------
  #   Three NET-NEW subtrees that close the last configuration gap between the
  #   two lightboxes. Until now this file described the PhotoSwipe renderer
  #   with two keys -- `enabled` and `theme` -- while the lightGallery path
  #   next to it carried a full `lightGallery.videojsOptions` block. A video
  #   opened through `lightbox.type: ps` therefore had a plain VideoJS control
  #   bar, and its lightGallery twin on the SAME PAGE, built from the SAME
  #   entry of ~/_data/modules/gallery_media.yml, had skip buttons, zoom
  #   buttons, a playback-rate menu and keyboard control.
  #
  #   options
  #   --------------------------------------------------------------------------
  #   Handed to videojs(el, options) as-is. This is the map VideoJS reads at
  #   construction time, so everything here shapes the player before its first
  #   frame. `autoplay` is deliberately ABSENT and would be ignored anyway:
  #   initVideoJsPlayer() forces it to false because playback is driven by
  #   PhotoSwipe's contentActivate/contentDeactivate events, not by the element.
  #
  #     values:                         VideoJS player options
  #     default:                        see below
  #
  #   plugins
  #   --------------------------------------------------------------------------
  #   The EXTENDED controls, which are not options at all: each is activated by
  #   calling a method on the finished player
  #   (`player.hotKeys()`, `player.skipButtons()`, `player.zoomButtons()`).
  #   That is why they need a block of their own and why nothing in `options`
  #   could ever have switched them on. The counterpart on the lightGallery
  #   path is `lightGallery.videojsOptions.hotKeysPlugin` /
  #   `.controlBar.skipButtonsPlugin` / `.controlBar.zoomPlugin`, applied by
  #   vjsProcessExtendedButtonsAndPlugins() in
  #   ~/assets/theme/j1/modules/lightGallery/js/plugins/lg-video.js.
  #
  #   Each entry is `{ enabled, options }`, so a plugin can be switched off
  #   without losing its settings. The plugin scripts themselves ship with the
  #   `videojs` resource; a page without that resource has no player to
  #   decorate either, and every activation step is skipped silently.
  #
  #   NOTE on the hotkey values. `alwaysCaptureHotkeys` and
  #   `captureDocumentHotkeys` are OFF here, unlike on the lightGallery path.
  #   PhotoSwipe owns the keyboard while its lightbox is open -- Escape closes
  #   it, the arrow keys move between slides -- and document-level capture would
  #   hand the arrow keys to the seek bar, leaving no way to reach the next
  #   video. Focusing the player still gives the full hotkey set.
  #
  #   NOTE on `zoomButtons`. Skipped for YouTube slides whatever this switch
  #   says: the YouTube tech renders into an <iframe> the plugin cannot
  #   transform. lg-video.js forces the same for the lightGallery path.
  #
  #     values:                         mapping of plugin -> {enabled, options}
  #     default:                        all three enabled
  #
  #   customProgressBar
  #   --------------------------------------------------------------------------
  #   Rebuilds the control bar in the uno layout: current time, progress
  #   control and duration are moved into a
  #   `.vjs-theme-uno.custom-progressbar-container` row, which is the hook the
  #   uno VideoJS stylesheet is written against. lg-video.js builds the same
  #   container for every lightGallery video, so leaving it out was why the two
  #   lightboxes showed a differently-shaped bar for one and the same file.
  #
  #     values:                         boolean (false|true)
  #     default:                        true
  #
  # autoplayMutedFallback / autoplayProbeTimeout
  # ----------------------------------------------------------------------------
  #   Two NET-NEW keys that make `autoplay: true` keep its promise on the
  #   YouTube renderer.
  #
  #   THE DEFECT THEY REPAIR
  #     A gallery on `lightbox.type: ps` with a YouTube source, `autoplay: true`
  #     and `videoAttributes.muted: false` opened, showed its poster correctly,
  #     started nothing, and left a `vjs-loading-spinner` turning over the
  #     poster for as long as the lightbox stayed open. Pressing play worked.
  #     Three things stacked up:
  #
  #       1. The start is REFUSED. `muted: false` on the YouTube path asks for
  #          an un-muted autoplay inside a CROSS-ORIGIN <iframe>. The embedded
  #          player applies its own autoplay policy in that frame and does not
  #          see the click that opened the lightbox, so the note on
  #          `jg_video_html5_pswp` in ~/_data/modules/gallery_control.yml --
  #          "user activation is sticky" -- holds for a same-document <video>
  #          and not for this tech.
  #       2. The refusal is SILENT. videojs-youtube drives the IFrame API, not
  #          an HTMLMediaElement; its play() returns no promise, so there is no
  #          NotAllowedError for the plugin to catch and warn about.
  #       3. The spinner LATCHES. The attempt takes the tech through BUFFERING,
  #          on which VideoJS adds `vjs-waiting` -- the class the stylesheet
  #          shows the spinner on -- and removes it only once currentTime has
  #          advanced. On a refused start it never does.
  #
  #   autoplayMutedFallback
  #   --------------------------------------------------------------------------
  #   Mute and retry once when the first attempt produced no playback, instead
  #   of leaving the slide on its poster. This is the behaviour of the VideoJS
  #   player option `autoplay: 'any'`; the plugin implements it itself because
  #   initVideoJsPlayer() forces the player's own `autoplay` to false so that
  #   PhotoSwipe -- not the element -- decides which slide plays.
  #
  #   The configured value is honoured FIRST and restored if even the muted
  #   attempt fails, so `videoAttributes.muted: false` keeps its meaning
  #   wherever it can be kept. `false` restores the single-attempt behaviour;
  #   the latched spinner is cleared either way, because a spinner over a
  #   stopped video is a defect under either policy.
  #
  #     values:                         boolean (false|true)
  #     default:                        true
  #
  #   autoplayProbeTimeout
  #   --------------------------------------------------------------------------
  #   How long (ms) to wait for each attempt to produce real playback before
  #   moving on. Success is read from the player's own `playing` event, so a
  #   video that starts normally never waits at all and pays nothing; the
  #   timeout governs only the silent-refusal case above. The value has to
  #   clear the YouTube handshake (IFrame API fetch, frame load, ready
  #   callback) on a cold cache, or the fallback fires while the first attempt
  #   is still legitimately in flight. Raise it on slow links.
  #
  #     values:                         integer (ms)
  #     default:                        1200
  #
  # autoplay -- TWO NEW MODES
  # ----------------------------------------------------------------------------
  #   `autoplay` stops being a plain boolean. `true` still means what it always
  #   meant; what changes is the value inherited when nothing is stated.
  #
  #     startOnFirst   THE NEW DEFAULT. Only the FIRST video slide that becomes
  #                    active in a lightbox session starts by itself; every
  #                    other slide of the group is left paused on its poster.
  #     startOnAll     The former `true` -- every video slide starts as it
  #                    becomes active.
  #     true           Accepted, identical to `startOnAll`.
  #     false          Unchanged: nothing starts by itself.
  #
  #   "First" is the first VIDEO slide activated in THIS session, not the
  #   lowest-numbered slide of the gallery: a visitor who clicks the fourth
  #   thumbnail opens on slide 4, and the option is about the slide they chose.
  #   The start is spent once per session, so coming back to that slide does
  #   not restart it; closing and re-opening the lightbox does.
  #
  #   The pairing with `videoAttributes.muted` is unchanged and still matters.
  #   `startOnFirst` reduces HOW MANY slides try to start, not WHETHER the
  #   browser permits the one that does -- an un-muted start is still subject to
  #   the autoplay policy and still falls through to the muted retry described
  #   above.
  #
  #   Independent of the mode: the video on the slide being LEFT is paused when
  #   the visitor moves on. That now holds for a jump of three slides or more as
  #   well, where PhotoSwipe destroys the slide rather than deactivating it.
  #
  #     values:                         startOnFirst | startOnAll | true | false
  #     default:                        startOnFirst
  #
  # ----------------------------------------------------------------------------
  #
  photoswipe:

    # --------------------------------------------------------------------------
    # AUTOMATIC NATURAL-SIZE DETECTION IS SWITCHABLE PER GALLERY
    # --------------------------------------------------------------------------
    # ~/_includes/themes/j1/modules/gallery/gallery.html resolves one new key
    # for every gallery, in three levels:
    #
    #   1. the size stated on the entry in ~/_data/modules/gallery_media.yml
    #      (an entry may write `auto-detect` as its own size)
    #   2. `photoswipe.auto_detect_size` of the gallery
    #      (~/_data/modules/gallery_control.yml)
    #   3. `auto_detect_size` of ~/_data/modules/defaults/photoswipe.yml
    #      (site-wide fallback, shipped as `false`)
    #
    # Where the result is `always`, or `missing` for an entry that states no
    # usable size, the include emits the token `auto-detect` in place of the
    # number and photoswipe-lightbox.js measures the asset instead of trusting
    # the declared size. See the block in photoswipe.yml for the full
    # vocabulary (false | missing | true | always).
    #
    # --------------------------------------------------------------------------
    # The token is NO LONGER emitted "in place of the number". It now rides on
    # a separate marker attribute, and the two size attributes stay numeric:
    #
    #   data-pswp-natural-size="auto-detect"
    #   data-pswp-width="1600"
    #   data-pswp-height="1067"
    #
    # Fix #14 put `auto-detect` into `data-pswp-width` itself, which the
    # SEPARATE photoswipe-core.js bundle -- the one that actually lays out the
    # slides -- read with `parseInt('auto-detect', 10)` and turned into NaN.
    # See the long note in photoswipe.yml for the full account.
    #
    # The vocabulary of this key is unchanged. The only behavioural difference
    # is an improvement: under `always` a stated size now survives as the
    # pre-measurement placeholder, so a slide whose probe fails falls back to
    # it rather than to 0.
    # --------------------------------------------------------------------------
    #
    auto_detect_size:                   false

    # --------------------------------------------------------------------------
    # VIDEO settings
    #
    videoOptions:

      autoplay:                         startOnFirst
      preventDragOffset:                40
      tracks:                           true

      autoplayMutedFallback:            true
      autoplayProbeTimeout:             1200

      videoAttributes:
        controls:                       ''
        playsinline:                    ''
        preload:                        auto
        muted:                          ''

      videojs:
        enabled:                        true
        theme:                          vjs-theme-uno
        customProgressBar:              true

        options:
          controls:                     true
          preload:                      auto
          fluid:                        false
          responsive:                   false
          playbackRates:                [0.25, 0.5, 1, 1.5, 2]

          controlBar:
            remainingTimeDisplay:       true
            pictureInPictureToggle:     false

            volumePanel:
              inline:                   false

        plugins:
          hotKeys:
            enabled:                    true
            options:
              volumeStep:               0.2
              seekStep:                 15
              enableMute:               true
              enableFullscreen:         true
              enableNumbers:            true
              enableVolumeScroll:       true
              enableHoverScroll:        true
              alwaysCaptureHotkeys:     false                                   # see NOTE above
              captureDocumentHotkeys:   false                                   # see NOTE above

          skipButtons:
            enabled:                    true
            options:
              forward:                  15
              backward:                 15
              backwardIndex:            0
              forwardIndex:             1

          zoomButtons:
            enabled:                    true                                    # ignored for YouTube
            options:
              moveX:                    0
              moveY:                    0
              rotate:                   0
              zoom:                     1

  # ----------------------------------------------------------------------------
  # lightGallery settings
  #
  lightGallery:
    plugins:                            lgThumbnail, lgVideo

    # --------------------------------------------------------------------------
    # lightGallery options
    #
    options:
      licenseKey:                       0000-0000-000-0000
      download:                         false
      alignThumbnails:                  left
      animateThumb:                     true
      autoplayFirstVideo:               true
      videojs:                          false

    # --------------------------------------------------------------------------
    # VideoJS options
    #
    videojsOptions:
      enabled:                          false

      muted:                            false
      preload:                          true

      controls:                         true
      controlBar:
        playbackRates:                  [0.25, 0.5, 1, 1.5, 2]
        remainingTimeDisplay:           true
        pictureInPictureToggle:         false

        volumePanel:
          inline:                       false

        hotkeysPlugin:
          enabled:                      true
          options:
            volumeStep:                 0.2

        skipButtonsPlugin:
          enabled:                      true
          options:
            forward:                    15
            backward:                   15

        zoomPlugin:
          enabled:                      true
          options:
            moveX:                      0
            moveY:                      0
            rotate:                     0
            zoom:                       1

