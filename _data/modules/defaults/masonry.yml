# ------------------------------------------------------------------------------
# Description
#
description:
  title:                                J1 Masonry
  scope:                                Default settings
  location:                             _data/modules/defaults/masonry.yml

# ------------------------------------------------------------------------------
# Default settings
#
defaults:

  # ============================================================================
  # GENERAL options
  # ----------------------------------------------------------------------------
  #
  gutters:                              3

  # ----------------------------------------------------------------------------
  # AJAX (HTML)
  #
  # The HTML portion of a grid are being read from a HTML file generated
  # automatically from its configuration for all grids configured.
  # AJAX methods are used to supply the needed HTML code at the time
  # a grid is initialized by the JS adapter.
  #
  xhr_data_path:                        /assets/data/masonry

  # ============================================================================
  # VideoJS settings
  # See details: https://jekyll.one/pages/public/manuals/videojs/videojs_api
  # ----------------------------------------------------------------------------
  #
  videojs:
    enabled:                            false

    theme:                              uno
    api:                                native                                  # native|videojs

    options:
      autoplay:                         false
      controls:                         true
      fluid:                            true
      muted:                            false
      preload:                          false
      playbackRates:                    [0.25, 0.5, 1, 1.5, 2]
      controlBar:
        remainingTimeDisplay:           true
        pictureInPictureToggle:         true
        skipButtons:
          forward:                      5
          backward:                     5


  # ============================================================================
  # Player settings
  # See: //jekyll.one/pages/public/manuals/videojs/lightgallery_api
  # ----------------------------------------------------------------------------
  #
  player:
    enabled:                            true

    # VideoJS
    # --------------------------------------------------------------------------
    videojsPlayer:
      enabled:                          true

      options:
        muted:                          false
        preload:                        false
        autoplayFirstVideo:             true
        playbackRates:                  [0.25, 0.5, 1, 1.5, 2]

      controls:                         true
      controlBar:
        remainingTimeDisplay:           true
        pictureInPictureToggle:         false
        playbackRates:                  [0.25, 0.5, 1, 1.5, 2]

        volumePanel:
          inline:                       false

        hotkeysPlugin:
          enabled:                      true
          options:
            volumeStep:                 0.2

        skipButtonsPlugin:
          enabled:                      true
          options:
            forward:                    15
            backward:                   15

        zoomPlugin:
          enabled:                      true
          options:
            moveX:                      0
            moveY:                      0
            rotate:                     0
            zoom:                       1

    # Youtube
    # --------------------------------------------------------------------------
    youTubePlayer:
      enabled:                          true
      api:                              videojs                                 # native|videojs

      options:
        autoPlay:                       true
        muted:                          true
        showinfo:                       true
        controls:                       true


  # ============================================================================
  # Lightbox settings
  # See settings for lightbox:     https://jekyll.one/pages/public/manuals/modules/lightbox/
  # See settings for lightGallery: https://jekyll.one/pages/public/manuals/videojs/videojs_api
  # ----------------------------------------------------------------------------
  #
  lightbox:
    enabled:                            false
    type:                               ps                                      # ps | lb | lg

  # ----------------------------------------------------------------------------
  # PhotoSwipeVideoPlugin plugin Fix #13
  #
  # NO `photoswipe:` BLOCK IN THIS FILE -- BY DECISION, NOT BY OMISSION
  # ----------------------------------------------------------------------------
  # Since PhotoSwipeVideoPlugin fix #12 the video plugin is opt-in per
  # gallery, and the per-grid switch for THIS module lives in
  # ~/_data/modules/masonry_control.yml:
  #
  #   photoswipe:
  #     videoOptions:
  #     enabled:                    true
  #
  # A reader looking for the matching DEFAULT will look here and find
  # nothing -- this comment is the answer. Restating `enabled: false` in a
  # net-new `photoswipe:` block was considered for fix #13 and REJECTED:
  #
  #   * the effective default (`false`) is baked into
  #     photoswipe-lightbox.js and documented in
  #     ~/_data/modules/defaults/photoswipe.yml, the file that owns every
  #     other PhotoSwipe key; a restatement here would be a second copy of
  #     a value this module does not read itself;
  #
  #   * masonry.html would start merging a subtree whose only content
  #     mirrors another module's documentation -- net-new noise with a
  #     drift risk (two files to keep aligned) and zero behaviour change.
  #
  # The asymmetry to ~/_data/modules/defaults/gallery.yml is intentional:
  # that file carries a `photoswipe:` block because the gallery module
  # ships per-gallery RENDERER defaults (`videoOptions.videojs`, ...) of
  # its own. The masonry module has none; its grids state only their
  # per-grid overrides in the control file.
  # ----------------------------------------------------------------------------

  # ----------------------------------------------------------------------------
  # PhotoSwipe lightbox
  #
  photoswipe:

    # Masonry, Photoswipe lightbox for videos Fix #2
    # --------------------------------------------------------------------------
    # `plugin.fullscreen` BELOW IS NOW READ -- FOR VIDEO GRIDS ON
    # `lightbox.type: ps`
    # --------------------------------------------------------------------------
    # masonry.html emits it as `data-pswp-fullscreen` on the container of every
    # video grid that selects the PhotoSwipe lightbox, and
    # _autoInitResolveFullscreenEnabled() in photoswipe-lightbox.js treats a
    # stated value as the FIRST of three levels -- ahead of the site-wide
    # `plugin.fullscreen` key of ~/_data/modules/defaults/photoswipe.yml.
    #
    # CONSEQUENCE OF THE `false` BELOW, worth stating plainly: because the merge
    # chain in masonry.html is SHALLOW (`merge`, not `deep_merge`, on an array
    # of grids), a video grid that states no `photoswipe:` block of its own
    # inherits this whole subtree and therefore emits
    # `data-pswp-fullscreen="false"` -- it is opted OUT, not left to the
    # site-wide key. That matches the site-wide value this repository ships
    # (`plugin.fullscreen: false` in defaults/photoswipe.yml), so no rendered
    # page changes today; it would diverge on a site that sets the site-wide
    # key to `true` and expects masonry grids to follow.
    #
    # A grid opts in by stating its own block, as the `youtube` grid of
    # ~/_data/modules/masonry_control.yml now does. Note that a per-grid
    # `photoswipe:` block REPLACES this one wholesale under the shallow merge,
    # so a grid that states `plugin.fullscreen` and needs a non-default
    # `videoOptions` must state both.
    #
    # `caption` below is untouched and still read by nobody -- the caption
    # plugin has no per-gallery attribute on the masonry path. It is the
    # obvious candidate for the next fix in this series; see the delivery note.
    # --------------------------------------------------------------------------
    #
    plugin:
      caption:                          false
      fullscreen:                       false

    videoOptions:
      enabled:                          false

  # ----------------------------------------------------------------------------
  # lightGallery lightbox
  #
  lightGallery:

    plugins:                            lgFullscreen, lgRotate, lgThumbnail, lgZoom

    options:
      licenseKey:                       0000-0000-000-0000
      download:                         false
      alignThumbnails:                  left
      animateThumb:                     true

    # custom thumbnails
    # --------------------------------------------------------------------------
    # addClass:                         lg-uno-thumbnails                       # customized thumbnails
    # appendThumbnailsTo:               .lg-outer                               # required for customized thumbnails
    # animateThumb:                     false                                   # required for customized thumbnails
    # allowMediaOverlap:                true                                    # required for customized thumbnails


  # ============================================================================
  # Masonry MODULE options
  # ----------------------------------------------------------------------------
  #
  #  initTimeout
  #  ---------------------------------------------------------------------------
  #  Delays the initialization of a grid after the HTML code is loaded.
  #  The delay depends on the browser used repectively how long it takes
  #  the DOM is updated for the dynamically loaded HTML code (AJAX).
  #
  #  values:                           integer (ms)
  #  default:                          500
  #
  #  hideDisabled
  #  ---------------------------------------------------------------------------
  #  Hide if the grid is disabled. The CSS style display is set to `none`
  #  for the element specified by `id`.
  #
  #  values:                           true|false
  #  default:                          true
  #
  # ----------------------------------------------------------------------------

  # ----------------------------------------------------------------------------
  # MODULE options
  #
  initTimeout:                          1200
  hideDisabled:                         true

  # ----------------------------------------------------------------------------
  # Bootstrap responsive options
  #
  responsive:
    xs:                                 12                                      # viewport: <  576px, 1 colum|s
    sm:                                 12                                      # viewport: ≥  576px, 1 colum|s
    md:                                 6                                       # viewport: ≥  768px, 2 colum|s
    lg:                                 4                                       # viewport: ≥  992px, 3 colum|s
    xl:                                 4                                       # viewport: ≥ 1200px, 4 colum|s

  # ----------------------------------------------------------------------------
  # split J1 Masonry data #2
  # Default per-grid caption settings. Moved here from masonry_player.yml
  # because all grids declared the same values (enabled:true, position:bottom).
  # Grids inherit these via deep_merge in masonry.html; override per grid
  # only when a different position or disabled state is needed.
  # ----------------------------------------------------------------------------
  caption:
    enabled:                            true
    position:                           bottom                                  # top|bottom|center

  # ----------------------------------------------------------------------------
  # CSS filter options
  #
  filters:
    enabled:                            false
    grayscale:                          1
    contrast:                           1
    brightness:                         1


  # ============================================================================
  # Masonry API options
  # ----------------------------------------------------------------------------

  # Settings
  # ----------------------------------------------------------------------------
  #  id
  #  ---------------------------------------------------------------------------
  #  Specifies the id used for a grid
  #
  #  values:                           string
  #  default:                          no defaults
  #
  #  percentPosition
  #  ---------------------------------------------------------------------------
  #  Sets item positions in percent values, rather than pixel values.
  #  Set percentPosition to true works well with percent-width items,
  #  as items will not transition their position on resize.
  #
  #  values:                           true|false
  #  default:                          false
  #
  #  horizontalOrder
  #  ---------------------------------------------------------------------------
  #  Lays out items to (mostly) maintain horizontal left-to-right order.
  #
  #  values:                           true|false
  #  default:                          false
  #
  #  resize
  #  ---------------------------------------------------------------------------
  #  Adjusts sizes and positions when window is resized. Enabled by default.
  #
  #  values:                           true|false
  #  default:                          true
  #
  #  transitionDuration
  #  ---------------------------------------------------------------------------
  #  Duration of the transition (seconds) when items change position.
  #
  #  values:                           float
  #  default:                          0.4
  #
  #  columnWidth
  #  ---------------------------------------------------------------------------
  #  Aligns items to a horizontal grid.
  #  It is recommend setting columnWidth. If columnWidth is not set, Masonry
  #  will use the outer width of the first item.
  #
  #  values:                           integer
  #  default:                          no defaults
  #
  #  stagger
  #  ---------------------------------------------------------------------------
  #  Staggers item transitions, so items transition incrementally after
  #  one another. Value (integer) set as a number of milliseconds.
  #
  #  values:                           integer
  #  default:                          30
  #
  #  itemSelector
  #  ---------------------------------------------------------------------------
  #  Specifies which child elements will be used as item elements in the layout.
  #  It is recommend always setting itemSelector. itemSelector is useful to
  #  exclude sizing elements or other elements that are not part of the layout.
  #
  #  values:                           CSS class
  #  default:                          no defaults
  #
  #  initLayout
  #  ---------------------------------------------------------------------------
  #  Enables|Disables layout on initialization. Disabled for J1 by default.
  #  If initLayout is to `false`, layout is DISABLED on initialization.
  #  Used to MANUALLY initialize a layout by methods or add events BEFORE
  #  the initial initialization of a layout (grid).
  #
  #  values:                           true|false
  #  default:                          true
  #
  # ----------------------------------------------------------------------------
  
  # ----------------------------------------------------------------------------
  # API options
  #
  initLayout:                           true
  originTop:                            true
  originLeft:                           true
  percentPosition:                      true
  horizontalOrder:                      true
  stagger:                              0.03                                    # given in seconds, 30ms
  transitionDuration:                   0.80                                    # given in seconds, 800ms
  gutter:                               0                                       # default: 10
  itemSelector:                         false                                   # default: grid-item (CSS class)
  resize:                               true
  containerStyle:                       null                                    # NOT used
  columnWidth:                          80                                      # NOT used

# ------------------------------------------------------------------------------
# END config