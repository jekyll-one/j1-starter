# ------------------------------------------------------------------------------
# Description
#
description:
  title:                                J1 MultiPlayer
  scope:                                Default settings
  location:                             _data/modules/defaults/multiPlayer.yml

# ------------------------------------------------------------------------------
# Default settings
#
defaults:

  # ----------------------------------------------------------------------------
  # GENERAL options
  # ============================================================================
  #
  #  initTimeout
  #  ---------------------------------------------------------------------------
  #  Delays the initialization of a grid after the HTML code is loaded.
  #  The delay depends on the browser used repectively how long it takes
  #  the DOM is updated for the dynamically loaded HTML code (AJAX).
  #
  #  values:                           integer (ms)
  #  default:                          500
  #
  #  hideDisabled
  #  ---------------------------------------------------------------------------
  #  Hide if the grid is disabled. The CSS style display is set to `none`
  #  for the element specified by `id`.
  #
  #  values:                           true|false
  #  default:                          true
  #
  # ----------------------------------------------------------------------------
  #
  enabled:                              false
  xhr_data_path:                        /assets/data/multiPlayer
  playlist_url_base:                    /assets/data/apps/multiPlayer/playlists/lists

  # CROSS-PAGE player synchronization
  #
  cross_page_sync:
    enabled:                            false
    on_play:                            true
    on_pause:                           true
    same_page:                          false
    channel:                            j1.multiPlayer.crossPageSync

  # AUDIO ONLY playback (YouTube entries only, see multiPlayer.yml for
  # the full note). Seeds the initial state of the title-bar switch of
  # THIS player; a persisted user toggle wins.
  #
  #   settings.audio_only             — seeds the initial switch state
  #                                     (localStorage user toggle wins)
  #   ui_elements.audioOnlySwitch     — suppresses the control when set
  #                                     to false (absent-key default: true)      
  #
  audio_only:                           false

  # FIXED AUDIO ONLY playback for players WITHOUT the title-bar switch
  #
  # Companion of 'audio_only'. Where 'audio_only' SEEDS the switch (and is
  # overruled by the first user toggle), 'set_audio_only' STATES the mode for
  # players that show no switch at all, so a viewer who cannot toggle is never
  # governed by a stale toggle left in localStorage.
  #
  # The key is read ONLY when the switch is not shown or is unavailable:
  #
  #   - ui_elements.audioOnlySwitch is false (the documented case), or
  #   - the player is disabled, or the playlist is disabled, or the rendered
  #     markup carries no playlist title bar the switch could be built into
  #
  # While the control is reachable it owns the state and this key is ignored
  # completely — the switch precedence (localStorage <- audio_only <- false)
  # then applies unchanged.
  #
  #   true      YouTube entries always play audio only
  #   false     YouTube entries always play with video
  #   (absent)  no opinion — behaviour identical to before this fix
  #
  # Inheritance: defaults (this file) <- user settings (multiPlayer.yml) <-
  # per-player entries (multiPlayer_control.yml).
  #
  set_audio_only:                       false

  # Per-media value edited in the player's Edit Media Settings dialog
  # (fields "Start At"/"End At") or shipped in a preloaded playlist JSON,
  # then the YAML chain: defaults <- user settings <- per-player entries
  #
  startAt:                              ""
  endAt:                                ""

  # Extend multiPlayer for new startAtDarkCheck param #1
  # DARK START of the playback window (all players, all source kinds)
  #
  # startAt is enforced by SEEKING: playback begins at 0 and the player
  # jumps to startAt a moment later, so the first frames of the media flash
  # up before the window starts. With the dark start enabled, the video
  # surface is hidden and the poster is shown instead until the startAt
  # position is reached; then the video is revealed. A safety timeout
  # reveals the video in any case, so the player can never stay black.
  #
  #   true      darken the video until startAt is reached
  #   false     show the video from the first frame (default)
  #
  # Only the picture is affected: the startAt seek, endAt, resume and
  # playlist autoadvance work the same either way. Media without a startAt
  # (or with startAt 0) are never darkened.
  #
  # Inheritance: defaults (this file) <- user settings (multiPlayer.yml) <-
  # per-player entries (multiPlayer_control.yml).
  #
  startAtDarkCheck:                     false

  # AUDIO FADE-IN (module default, all players, all source kinds)
  #
  # Ramps the audio UP to the player volume when a media item starts, instead
  # of starting at full volume. The implementation mirrors the AmplitudeJS
  # module's ytp plugin (ytp.js, function ytpFadeInAudio): the player starts
  # muted and the volume is raised in a number of iteration steps. The number
  # of steps controls how long and how smooth the transition is.
  #
  #   ''         no fade-in (the shipped default - behaviour as before)
  #   off        same as '' - written out for readability
  #   default    150 iteration steps (shortest fade)
  #   slow       250 iteration steps
  #   slower     350 iteration steps
  #   slowest    500 iteration steps (longest fade)
  #
  # Precedence, first value that says anything wins:
  #
  #   1. the per-media value edited in the player's Edit Media Settings dialog
  #      (field "Audio Fade In") or shipped in a preloaded playlist JSON; the
  #      dialog can state 'off' for ONE media, overruling a configured fade
  #   2. this YAML chain: defaults <- user settings (multiPlayer.yml) <-
  #      per-player entries (multiPlayer_control.yml)
  #   3. no fade
  #
  # The default stays EMPTY on purpose: an existing site keeps its current
  # playback behaviour until a fade is asked for explicitly.
  #
  audioFadeIn:                          default

  # ----------------------------------------------------------------------------
  # MODULE options
  # ============================================================================
  #
  #   videoJS.poster.autoGenerate
  #   --------------------------------------------------------------------------
  #   If true, the left and right navigation arrows which appear
  #   on mouse hover when viewing image sets will always be visible
  #   on devices which support touch.
  #
  #   values:                         boolean (false|true)
  #   default:                        false
  #
  #  ---------------------------------------------------------------------------
  #   enabled          master on/off switch
  #   capturePosition  capture point in SECONDS (configurable start position).
  #                    When <= 0 the captureFraction is used instead.
  #   captureFraction  fraction (0..100) percent of the duration used as
  #                    the image capture point when capturePosition <= 0
  #   maxWidth         output is downscaled to at most this width in px
  #                    (aspect preserved); 0 keeps the native frame size.
  #   mimeType         output image type ('jpeg'|'png' |'webp')
  #   quality          0..1 encoder quality (jpeg/webp only)
  #
  # ----------------------------------------------------------------------------
  #
  ui_elements:
    edit_playlist_button:               true
    show_playlist_button:               true

    playlist_rate_button:               true
    playlist_edit_button:               true
    playlist_delete_button:             true
    playlist_download_button:           false
    playlist_download_all_button:       false

    audioOnlySwitch:                    false
    modeSwitch:                         true
    mergeSwitch:                        true

    loop:                               true
    search:                             true
    sort:                               true

  # ----------------------------------------------------------------------------
  # PLAYLIST options
  # ============================================================================
  #
  #   playlist.cards.perRow
  #   --------------------------------------------------------------------------
  #   Number of playlist cards rendered per row while the playlist is in CARD
  #   mode (toggled by the switch div#playlistModeSwitch_<player.id>).
  #
  #   The value is resolved per player instance (defaults <- settings <-
  #   per-player control) and written by videoPlayer.js onto that player's
  #   container div#videoplayer_playlist_parent_<player.id> as the custom
  #   property --playlist-cards-per-row plus the matching inline
  #   grid-template-columns. It overrides the stylesheet default of 2 columns.
  #
  #   Values outside the supported range, or non-numeric values, fall back to 2.
  #   On screens narrower than 992px videoPlayer.css forces a single column,
  #   regardless of this setting.
  #
  #   values:                           integer (1 .. 6)
  #   default:                          2
  #
  # ----------------------------------------------------------------------------
  #
  playlist:
    enabled:                            true

    preload:                            []
    preload_attempts:                   2

    close_on_play:                      false
    pip:                                false

    type:                               list                                    # list | cards

    cards:
      perRow:                           2                                       # 1..6, cards per row in card mode
  
  # ----------------------------------------------------------------------------
  # VIDEOJS options
  # ============================================================================
  #
  #   autoStart
  #   --------------------------------------------------------------------------
  #
  #
  #   values:                           boolean
  #   default:                          true
  #
  # ----------------------------------------------------------------------------
  #
  videoJS:

    autoStart:                          true
    preloadVideo:                       true                                    # preload: 'auto' | 'metadata' | 'none'

    playbackRates:
      enabled:                          true
      values:                           [ 0.25, 0.5, 1, 1.5, 2 ]

    poster:
      autoGenerate:
        enabled:                        true
        capturePosition:                5                                       # default: 5,    start position (seconds), when ≤ 0 captureFraction is used
        captureFraction:                10                                      # default: 10,   start position (percent from duration)
        maxWidth:                       540                                     # default: 320,  pixel (4/3 ratio)
        mimeType:                       webp                                    # default: webp, image type (jpeg|png|webp)
        quality:                        0.8                                     # default: 0.8,  0..1 encoder quality

    # --------------------------------------------------------------------------
    # Replaced YouTube player tech with native HTML5 video.js player.
    # All YouTube-specific parameters (cc_load_policy, disablekb, enablejsapi,
    # modestbranding, rel, showinfo, etc.) have been removed.
    # --------------------------------------------------------------------------
    #
    # --------------------------------------------------------------------------
    # PLAYER options
    # ==========================================================================
    #
    #   videoJS.poster.autoGenerate
    #   ------------------------------------------------------------------------
    #   If true, the left and right navigation arrows which appear
    #   on mouse hover when viewing image sets will always be visible
    #   on devices which support touch.
    #
    #   values:                         boolean (false|true)
    #   default:                        false
    #
    #  -------------------------------------------------------------------------
    #   enabled          master on/off switch
    #   capturePosition  capture point in SECONDS (configurable start position).
    #                    When <= 0 the captureFraction is used instead.
    #   captureFraction  fraction (0..100) percent of the duration used as
    #                    the image capture point when capturePosition <= 0
    #   maxWidth         output is downscaled to at most this width in px
    #                    (aspect preserved); 0 keeps the native frame size.
    #   mimeType         output image type ('jpeg'|'png' |'webp')
    #   quality          0..1 encoder quality (jpeg/webp only)
    #
    # --------------------------------------------------------------------------
    #
    players:

      native:
        autoplay:                       true                                    # true | false
        controls:                       true
        fluid:                          true                                    # responsive, fills container width
        fill:                           false                                   # stretch to container dimensions
        responsive:                     true
        preload:                        auto                                    # auto | metadata | none
        playsinline:                    true                                    # prevent fullscreen on iOS by default

        # poster settings
        #
        poster:                         true
        default_poster:                 /assets/image/icon/videojs/videojs-poster.png
        poster_base:                    video-folder                            # same folder as video
        poster_image:                   poster.jpg                              # poster image

        # video settings
        #
        start:                          true                                    # set start (trim) of a video allowed
        end:                            true                                    # set end (trim) of a video allowed

        # source type priorities (tried in order)
        #
        sourceOrder:                    [ mp4 ]                                 # [ mp4, webm, ogv ]

        # FULLSCREEN on iPhone (the #3 setting, now in the chain that is read).
        #
        # iPhone Safari (and every other browser on iOS) has no fullscreen for
        # a page element, only for the bare <video>. VideoJS then hands the
        # fullscreen button to the NATIVE player of the OS, and the VideoJS
        # player -- control bar, zoom panel, zoom gestures -- is gone for as
        # long as fullscreen lasts.
        #
        #   true    VideoJS uses its FULL-WINDOW mode instead: the player is
        #           pinned over the browser window and stays the VideoJS
        #           player, zoom panel and gestures included. The browser bars
        #           stay visible.
        #   false   the VideoJS default: the native OS player, without plugin.
        #
        # No effect on browsers with element fullscreen (desktop, Android,
        # iPad Safari): they never reach this fallback.
        #
        preferFullWindow:               true                                    # default: false

        # VideoJS - Extend plugin zoom #5
        # NETWORK RECOVERY for native sources (mp4, mp3, webm, ...).
        #
        # Large remote files are streamed in pieces (HTTP 206 Partial
        # Content). When the media server or the network closes such a
        # connection (console: ERR_CONNECTION_RESET, ERR_HTTP2_PROTOCOL_ERROR),
        # the browser stops the video. Chrome then often reports the error
        # as CODE:4 "format is not supported", although the file is fine.
        #
        # With recovery switched on, the player loads the file again after a
        # short pause, jumps back to the last position and continues playing.
        # The waiting time doubles with every attempt. After `maxRetries`
        # failed attempts the error screen is shown with a clearer message.
        #
        # Every key may be left out; the values shown are the built-in
        # defaults. YouTube videos are never affected.
        #
        networkRecovery:
          enabled:                      true                                    # default: true
          maxRetries:                   3                                       # default: 3   (0..10)
          retryDelay:                   1000                                    # default: 1000 ms, doubled per attempt
          progressReset:                10                                      # default: 10 s of playback restore the full budget

    # VideoJS - Extend plugin zoom #7
    # POSTER settings
    #
    # Playlist entries that point at a native media file (mp3/mp4/webm) and
    # carry no poster yet get one captured off-screen: a detached <video>
    # loads the file, seeks to a frame and stores it as a small image in the
    # playlist record. For a REMOTE file that capture is a second, parallel
    # download of the same file - and a media server that already serves a
    # running playback answers such a parallel request with a dropped
    # connection (the error the networkRecovery above then has to repair).
    #
    # `backfillWait` is the time such a capture waits for EVERY player of the
    # page to stop loading before it opens its own download. Local
    # (same-origin) files are never delayed, and an entry whose file is
    # currently loaded in a player is left out completely: its frame is
    # taken from the running playback instead.
    #
    #   10000   wait up to 10 seconds (the built-in default)
    #   0       never wait (the behaviour before this fix)
    #
    # Every other key of poster.autoGenerate (enabled, capturePosition,
    # captureFraction, maxWidth, mimeType, quality, generate_timeout) keeps
    # the value of the MultiPlayer defaults; the chain merges recursively.
    #
    poster:
      autoGenerate:
        backfillWait:                   10000                                   # default: 10000 ms

      # ------------------------------------------------------------------------
      # The YouTube player used by J1 VideoPlayer now reads ALL its player 
      # parameters from the players.native key above. The players.youtube
      # section below is retained for backward-compatibility with other
      # modules (e.g. Amplitude/YTP) that still reference it directly;
      # it is NO LONGER used by VideoPlayer's YouTube playback path.
      # ------------------------------------------------------------------------
      #
      youtube:

        # privacy settings
        #
        privacy_enhanced:               true                                    # enable|disable privacy-enhanced host 'youtube-nocookie.com'

        # core settings
        #
        autoplay:                       true                                    # true|false, play video after load
        cc_load_policy:                 0                                       # 0|1, captions initially hidden
        controls:                       1                                       # 0|1, disable|enable (vjs) controlbar
        disablekb:                      1
        enablejsapi:                    1    
        fs:                             0
        iv_load_policy:                 3                                       # video annotations not shown
        loop:                           0
        modestbranding:                 1
        rel:                            0
        showinfo:                       0

        # poster settings
        #
        poster:                         false
        default_poster:                 /assets/image/icon/videojs/videojs-poster.png
        poster_base:                    //img.youtube.com/vi
        poster_qualty:                  hqdefault                               # hqdefault|mqdefault, poster taken from poster_base at high quality resolution

        # video settings
        #
        start:                          true                                    # set start (trim) of a video allowed
        end:                            true                                    # set end (trim) of a video allowed

    # --------------------------------------------------------------------------
    # PLUGIN options
    # ==========================================================================
    #
    #   videoJS.poster.autoGenerate
    #   ------------------------------------------------------------------------
    #   If true, the left and right navigation arrows which appear
    #   on mouse hover when viewing image sets will always be visible
    #   on devices which support touch.
    #
    #   values:                         boolean (false|true)
    #   default:                        false
    #
    #  -------------------------------------------------------------------------
    #   enabled          master on/off switch
    #   capturePosition  capture point in SECONDS (configurable start position).
    #                    When <= 0 the captureFraction is used instead.
    #   captureFraction  fraction (0..100) percent of the duration used as
    #                    the image capture point when capturePosition <= 0
    #   maxWidth         output is downscaled to at most this width in px
    #                    (aspect preserved); 0 keeps the native frame size.
    #   mimeType         output image type ('jpeg'|'png' |'webp')
    #   quality          0..1 encoder quality (jpeg/webp only)
    #
    # --------------------------------------------------------------------------
    #
    plugins:
      enabled:                          false

      playlist:
        enabled:                        true
        autoplay:                       true                                    # play video after load
        autoadvance:                    true                                    # play next item when current/active video ends
        autoadvance_delay:              0                                       # delay (seconds) for playing next video
        poster:                         true                                    # enable|disable poster settings
#       repeat:                         false                                   # NOT supported, run playlist in (endless) loop
#       reverse:                        false                                   # NOT supported, run playlist in reverse order
#       shuffle:                        false                                   # NOT supported, randomize the contents of the playlist

      autoCaption:
        enabled:                        false

      hotKeys:
        enabled:                        true

        seekStep:                       15
        volumeStep:                     0.1

        alwaysCaptureHotkeys:           true
        captureDocumentHotkeys:         false                                   # Capture document keydown events even if the player does not have focus (default: false)
        hotkeysFocusElementFilter:      'function () { return false }'          # default
        enableFullscreen:               true
        enableHoverScroll:              true
        enableInactiveFocus:            true
        enableJogStyle:                 false
        enableMute:                     true
        enableModifiersForNumbers:      true
        enableNumbers:                  false
        enableVolumeScroll:             true
        skipInitialFocus:               false                                   # stops focusing the player on initial Play (default: false)

      skipButtons:
        enabled:                        true
        surroundPlayButton:             true

        backwardIndex:                  1
        forwardIndex:                   1
        forward:                        10
        backward:                       10

      nextPrevButtons:
        enabled:                        true
        autoplay:                       true                                    # play video after load

      zoomButtons:
        enabled:                        true

        moveX:                          0
        moveY:                          0
        rotate:                         0
        zoom:                           1

        # MASTER switch of the gesture layer (pan, pinch, wheel, double tap).
        # false: no ZoomGesture component, no listener, page scrolling is
        # never touched. Only effective where zoomButtons itself is enabled
        # and the source is a native (mp4) video.
        #
        # VideoJS - Extend plugin zoom #5
        # DEPRECATED. The master switch is `gestures.enabled` below; with both
        # keys present `gestures.enabled` wins anyway, so this line had no
        # effect of its own any more. Kept as a comment for reference. A
        # per-player entry in multiPlayer_control.yml that still uses
        # `gestureHandler` keeps working as long as the new key is not
        # declared on any layer of that player's chain -- it IS declared here,
        # so switch single players with `gestures.enabled` as well.
        #
        # Original (deprecated, preserved for reference):
        # gestureHandler:                 true

        # Gestures settimgs
        #
        gestures:
          # VideoJS - Extend plugin zoom #5
          # This key is now the one and only MASTER switch read by the zoom
          # plugin (resolved in zoom.js, _resolveGestureMaster). Default: false.
          #
          # MASTER switch of the gesture layer (pan, pinch, wheel, double tap).
          # If set to false: no zoom gesture enabled for native (mp4) video.
          #
          enabled:                      false

    # Fix videoFilters plugin für VideoJS #1
    # --------------------------------------------------------------------------
    # videoFilters: brightness, contrast and saturation of the picture, set by
    # the viewer with three sliders. A button in the control bar opens them.
    #
    # NET-NEW block. Every key below is shown with the value the plugin uses
    # when the key is left out (videoFilters.js, DEFAULT_OPTIONS), so this
    # block may be shortened to the keys that differ.
    #
    # SCOPE NOTE. Same as for zoomButtons above: these values end up in
    # j1.modules.videojs.options and are NOT read by J1 MultiPlayer or by the
    # PhotoSwipe video galleries. The MultiPlayer takes the block from its
    # own chain (multiPlayer.yml <- multiPlayer_control.yml), a gallery from
    # photoswipe.videoOptions.videojs.plugins in gallery_control.yml.
    #
    # Fix videoFilters plugin für VideoJS #2
    # ACTIVATION NOTE. A VideoJS plugin is switched on by CALLING its method
    # on the player (player.videoFilters({...})); a block in a YAML file is
    # only data until a script does that. With this fix two callers do:
    #
    #   J1 MultiPlayer            player.js                   (own chain)
    #   PhotoSwipe video gallery  photoswipe-video-plugin.js  (gallery chain)
    #
    # THIS block is read by neither of them (see the SCOPE NOTE). It takes
    # effect only where the script that builds a VideoJS player from
    # j1.modules.videojs.options calls player.videoFilters() next to
    # player.zoomButtons(). That script was not part of this fix -- OPEN POINT.
    #
    # In every case videoFilters.js and videoFilters.css must be loaded with
    # the `videojs` resource; registering the plugin is what makes
    # player.videoFilters a function in the first place.
    #
    videoFilters:
      enabled:                          false

      # Plugin options
      # ------------------------------------------------------------------------
      # Start values. 1 leaves the picture unchanged, 1.2 = 120%. A value the
      # viewer has chosen before (see persist) wins over these.
      #
      brightness:                       1                                       # default: 1
      contrast:                         1                                       # default: 1
      saturation:                       1                                       # default: 1  (0 = grey)

      # Range of each slider. min is never below 0 (negative CSS filter
      # values are invalid and would drop the whole filter).
      #
      ranges:

        brightness:
          min:                          0
          max:                          2
          step:                         1

        contrast:
          min:                          0
          max:                          2
          step:                         1

        saturation:
          min:                          0
          max:                          3
          step:                         1

      # Where the sliders are shown.
      #
      #   floating      over the picture, like the zoom panel. They fade out
      #                 and in together with the control bar.
      #   controlBar    inside the control bar, in front of insertBefore
      #                 (the layout of version 1.0.0)
      #
      placement:                        floating                                # default: floating
      position:                         bottom-left                             # floating only: top-left|top-right|bottom-left|bottom-right
      showTitle:                        true                                    # floating only: header line with name, reset and close button

      insertBefore:                     FullscreenToggle                        # control bar child the BUTTON is placed in front of
      icon:                             magic                                   # magic|spark|palette|gear|wand|crystal|camera|wave|leaf|star

      showSliders:                      true                                    # false = API only, no button, no sliders
      showButton:                       true                                    # false = sliders shown permanently
      showValues:                       true                                    # percentage next to each slider
      showReset:                        true                                    # reset button
      open:                             false                                   # sliders initially open

      # Target of the reset button (and of a double click on a slider).
      #
      #   neutral       the original picture (100% / 100% / 100%)
      #   initial       the start values configured above
      #
      resetTo:                          neutral                                 # default: neutral

      applyToPoster:                    true                                    # filter the poster as well

      # Video techs the filter works for. html5 = native (mp4) video. Add
      # youtube to filter YouTube videos as well. For any other tech the
      # filter is switched off and the button is hidden.
      #
      techs:                            [ html5 ]                               # default: [ html5 ]

      # The values a viewer chooses are stored in the browser (localStorage)
      # per player and restored on the next visit.
      #
      #   scope   page    one record per page and player id (default)
      #           player  one record per player id, on every page
      #   key     a fixed record name instead of the player id
      #   prefix  prefix of the localStorage key
      #
      # A viewer who resets to the start values above has no record any
      # more, so a later change of those values reaches them again.
      #
      persist:
        enabled:                        true                                    # default: true
        scope:                          page                                    # default: page
#       key:                            videoFilters
        prefix:                         videoFilters                            # default: j1.videoFilters

# ------------------------------------------------------------------------------
# END config