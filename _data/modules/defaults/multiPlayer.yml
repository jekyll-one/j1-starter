# ------------------------------------------------------------------------------
# Description
#
description:
  title:                                J1 MultiPlayer
  scope:                                Default settings
  location:                             _data/modules/defaults/multiPlayer.yml

# ------------------------------------------------------------------------------
# Default settings
#
defaults:

  # ----------------------------------------------------------------------------
  # GENERAL options
  # ============================================================================
  #
  #  initTimeout
  #  ---------------------------------------------------------------------------
  #  Delays the initialization of a grid after the HTML code is loaded.
  #  The delay depends on the browser used repectively how long it takes
  #  the DOM is updated for the dynamically loaded HTML code (AJAX).
  #
  #  values:                           integer (ms)
  #  default:                          500
  #
  #  hideDisabled
  #  ---------------------------------------------------------------------------
  #  Hide if the grid is disabled. The CSS style display is set to `none`
  #  for the element specified by `id`.
  #
  #  values:                           true|false
  #  default:                          true
  #
  # ----------------------------------------------------------------------------
  #
  enabled:                              false
  xhr_data_path:                        /assets/data/multiPlayer
  playlist_url_base:                    /assets/data/apps/multiPlayer/playlists/lists

  # CROSS-PAGE player synchronization
  #
  cross_page_sync:
    enabled:                            false
    on_play:                            true
    on_pause:                           true
    same_page:                          false
    channel:                            j1.multiPlayer.crossPageSync

  # AUDIO ONLY playback (YouTube entries only, see multiPlayer.yml for
  # the full note). Seeds the initial state of the title-bar switch of
  # THIS player; a persisted user toggle wins.
  #
  #   settings.audio_only             — seeds the initial switch state
  #                                     (localStorage user toggle wins)
  #   ui_elements.audioOnlySwitch     — suppresses the control when set
  #                                     to false (absent-key default: true)      
  #
  audio_only:                           false

  # FIXED AUDIO ONLY playback for players WITHOUT the title-bar switch
  #
  # Companion of 'audio_only'. Where 'audio_only' SEEDS the switch (and is
  # overruled by the first user toggle), 'set_audio_only' STATES the mode for
  # players that show no switch at all, so a viewer who cannot toggle is never
  # governed by a stale toggle left in localStorage.
  #
  # The key is read ONLY when the switch is not shown or is unavailable:
  #
  #   - ui_elements.audioOnlySwitch is false (the documented case), or
  #   - the player is disabled, or the playlist is disabled, or the rendered
  #     markup carries no playlist title bar the switch could be built into
  #
  # While the control is reachable it owns the state and this key is ignored
  # completely — the switch precedence (localStorage <- audio_only <- false)
  # then applies unchanged.
  #
  #   true      YouTube entries always play audio only
  #   false     YouTube entries always play with video
  #   (absent)  no opinion — behaviour identical to before this fix
  #
  # Inheritance: defaults (this file) <- user settings (multiPlayer.yml) <-
  # per-player entries (multiPlayer_control.yml).
  #
  set_audio_only:                       false

  # Per-media value edited in the player's Edit Media Settings dialog
  # (fields "Start At"/"End At") or shipped in a preloaded playlist JSON,
  # then the YAML chain: defaults <- user settings <- per-player entries
  #
  startAt:                              "00:00:00"
  endAt:                                ""

  # AUDIO FADE-IN (module default, all players, all source kinds)
  #
  # Ramps the audio UP to the player volume when a media item starts, instead
  # of starting at full volume. The implementation mirrors the AmplitudeJS
  # module's ytp plugin (ytp.js, function ytpFadeInAudio): the player starts
  # muted and the volume is raised in a number of iteration steps. The number
  # of steps controls how long and how smooth the transition is.
  #
  #   ''         no fade-in (the shipped default - behaviour as before)
  #   off        same as '' - written out for readability
  #   default    150 iteration steps (shortest fade)
  #   slow       250 iteration steps
  #   slower     350 iteration steps
  #   slowest    500 iteration steps (longest fade)
  #
  # Precedence, first value that says anything wins:
  #
  #   1. the per-media value edited in the player's Edit Media Settings dialog
  #      (field "Audio Fade In") or shipped in a preloaded playlist JSON; the
  #      dialog can state 'off' for ONE media, overruling a configured fade
  #   2. this YAML chain: defaults <- user settings (multiPlayer.yml) <-
  #      per-player entries (multiPlayer_control.yml)
  #   3. no fade
  #
  # The default stays EMPTY on purpose: an existing site keeps its current
  # playback behaviour until a fade is asked for explicitly.
  #
  audioFadeIn:                          default

  # ----------------------------------------------------------------------------
  # MODULE options
  # ============================================================================
  #
  #   videoJS.poster.autoGenerate
  #   --------------------------------------------------------------------------
  #   If true, the left and right navigation arrows which appear
  #   on mouse hover when viewing image sets will always be visible
  #   on devices which support touch.
  #
  #   values:                         boolean (false|true)
  #   default:                        false
  #
  #  ---------------------------------------------------------------------------
  #   enabled          master on/off switch
  #   capturePosition  capture point in SECONDS (configurable start position).
  #                    When <= 0 the captureFraction is used instead.
  #   captureFraction  fraction (0..100) percent of the duration used as
  #                    the image capture point when capturePosition <= 0
  #   maxWidth         output is downscaled to at most this width in px
  #                    (aspect preserved); 0 keeps the native frame size.
  #   mimeType         output image type ('jpeg'|'png' |'webp')
  #   quality          0..1 encoder quality (jpeg/webp only)
  #
  # ----------------------------------------------------------------------------
  #
  ui_elements:
    edit_playlist_button:               true
    show_playlist_button:               true

    playlist_rate_button:               true
    playlist_edit_button:               true
    playlist_delete_button:             true
    playlist_download_button:           false
    playlist_download_all_button:       false

    audioOnlySwitch:                    false
    modeSwitch:                         true
    mergeSwitch:                        true

    loop:                               true
    search:                             true
    sort:                               true

  # ----------------------------------------------------------------------------
  # PLAYLIST options
  # ============================================================================
  #
  #   playlist.cards.perRow
  #   --------------------------------------------------------------------------
  #   Number of playlist cards rendered per row while the playlist is in CARD
  #   mode (toggled by the switch div#playlistModeSwitch_<player.id>).
  #
  #   The value is resolved per player instance (defaults <- settings <-
  #   per-player control) and written by videoPlayer.js onto that player's
  #   container div#videoplayer_playlist_parent_<player.id> as the custom
  #   property --playlist-cards-per-row plus the matching inline
  #   grid-template-columns. It overrides the stylesheet default of 2 columns.
  #
  #   Values outside the supported range, or non-numeric values, fall back to 2.
  #   On screens narrower than 992px videoPlayer.css forces a single column,
  #   regardless of this setting.
  #
  #   values:                           integer (1 .. 6)
  #   default:                          2
  #
  # ----------------------------------------------------------------------------
  #
  playlist:
    enabled:                            true

    preload:                            []
    preload_attempts:                   2

    close_on_play:                      false
    pip:                                false

    type:                               list                                    # list | cards

    cards:
      perRow:                           2                                       # 1..6, cards per row in card mode
  
  # ----------------------------------------------------------------------------
  # VIDEOJS options
  # ============================================================================
  #
  #   autoStart
  #   --------------------------------------------------------------------------
  #
  #
  #   values:                           boolean
  #   default:                          true
  #
  # ----------------------------------------------------------------------------
  #
  videoJS:

    autoStart:                          true
    preloadVideo:                       true                                    # preload: 'auto' | 'metadata' | 'none'

    playbackRates:
      enabled:                          true
      values:                           [ 0.25, 0.5, 1, 1.5, 2 ]

    poster:
      autoGenerate:
        enabled:                        true
        capturePosition:                5                                       # default: 5,    start position (seconds), when ≤ 0 captureFraction is used
        captureFraction:                10                                      # default: 10,   start position (percent from duration)
        maxWidth:                       540                                     # default: 320,  pixel (4/3 ratio)
        mimeType:                       webp                                    # default: webp, image type (jpeg|png|webp)
        quality:                        0.8                                     # default: 0.8,  0..1 encoder quality

    # --------------------------------------------------------------------------
    # Replaced YouTube player tech with native HTML5 video.js player.
    # All YouTube-specific parameters (cc_load_policy, disablekb, enablejsapi,
    # modestbranding, rel, showinfo, etc.) have been removed.
    # --------------------------------------------------------------------------
    #
    # --------------------------------------------------------------------------
    # PLAYER options
    # ==========================================================================
    #
    #   videoJS.poster.autoGenerate
    #   ------------------------------------------------------------------------
    #   If true, the left and right navigation arrows which appear
    #   on mouse hover when viewing image sets will always be visible
    #   on devices which support touch.
    #
    #   values:                         boolean (false|true)
    #   default:                        false
    #
    #  -------------------------------------------------------------------------
    #   enabled          master on/off switch
    #   capturePosition  capture point in SECONDS (configurable start position).
    #                    When <= 0 the captureFraction is used instead.
    #   captureFraction  fraction (0..100) percent of the duration used as
    #                    the image capture point when capturePosition <= 0
    #   maxWidth         output is downscaled to at most this width in px
    #                    (aspect preserved); 0 keeps the native frame size.
    #   mimeType         output image type ('jpeg'|'png' |'webp')
    #   quality          0..1 encoder quality (jpeg/webp only)
    #
    # --------------------------------------------------------------------------
    #
    players:

      native:
        autoplay:                       true                                    # true | false
        controls:                       true
        fluid:                          true                                    # responsive, fills container width
        fill:                           false                                   # stretch to container dimensions
        responsive:                     true
        preload:                        auto                                    # auto | metadata | none
        playsinline:                    true                                    # prevent fullscreen on iOS by default

        # poster settings
        #
        poster:                         true
        default_poster:                 /assets/image/icon/videojs/videojs-poster.png
        poster_base:                    video-folder                            # same folder as video
        poster_image:                   poster.jpg                              # poster image

        # video settings
        #
        start:                          true                                    # set start (trim) of a video allowed
        end:                            true                                    # set end (trim) of a video allowed

        # source type priorities (tried in order)
        #
        sourceOrder:                    [ mp4 ]                                 # [ mp4, webm, ogv ]

      # ------------------------------------------------------------------------
      # The YouTube player used by J1 VideoPlayer now reads ALL its player 
      # parameters from the players.native key above. The players.youtube
      # section below is retained for backward-compatibility with other
      # modules (e.g. Amplitude/YTP) that still reference it directly;
      # it is NO LONGER used by VideoPlayer's YouTube playback path.
      # ------------------------------------------------------------------------
      #
      youtube:

        # privacy settings
        #
        privacy_enhanced:               true                                    # enable|disable privacy-enhanced host 'youtube-nocookie.com'

        # core settings
        #
        autoplay:                       true                                    # true|false, play video after load
        cc_load_policy:                 0                                       # 0|1, captions initially hidden
        controls:                       1                                       # 0|1, disable|enable (vjs) controlbar
        disablekb:                      1
        enablejsapi:                    1    
        fs:                             0
        iv_load_policy:                 3                                       # video annotations not shown
        loop:                           0
        modestbranding:                 1
        rel:                            0
        showinfo:                       0

        # poster settings
        #
        poster:                         false
        default_poster:                 /assets/image/icon/videojs/videojs-poster.png
        poster_base:                    //img.youtube.com/vi
        poster_qualty:                  hqdefault                               # hqdefault|mqdefault, poster taken from poster_base at high quality resolution

        # video settings
        #
        start:                          true                                    # set start (trim) of a video allowed
        end:                            true                                    # set end (trim) of a video allowed


    # --------------------------------------------------------------------------
    # PLUGIN options
    # ==========================================================================
    #
    #   videoJS.poster.autoGenerate
    #   ------------------------------------------------------------------------
    #   If true, the left and right navigation arrows which appear
    #   on mouse hover when viewing image sets will always be visible
    #   on devices which support touch.
    #
    #   values:                         boolean (false|true)
    #   default:                        false
    #
    #  -------------------------------------------------------------------------
    #   enabled          master on/off switch
    #   capturePosition  capture point in SECONDS (configurable start position).
    #                    When <= 0 the captureFraction is used instead.
    #   captureFraction  fraction (0..100) percent of the duration used as
    #                    the image capture point when capturePosition <= 0
    #   maxWidth         output is downscaled to at most this width in px
    #                    (aspect preserved); 0 keeps the native frame size.
    #   mimeType         output image type ('jpeg'|'png' |'webp')
    #   quality          0..1 encoder quality (jpeg/webp only)
    #
    # --------------------------------------------------------------------------
    #
    plugins:
      enabled:                          false

      playlist:
        enabled:                        true
        autoplay:                       true                                    # play video after load
        autoadvance:                    true                                    # play next item when current/active video ends
        autoadvance_delay:              0                                       # delay (seconds) for playing next video
        poster:                         true                                    # enable|disable poster settings
#       repeat:                         false                                   # NOT supported, run playlist in (endless) loop
#       reverse:                        false                                   # NOT supported, run playlist in reverse order
#       shuffle:                        false                                   # NOT supported, randomize the contents of the playlist

      autoCaption:
        enabled:                        false

      hotKeys:
        enabled:                        true

        seekStep:                       15
        volumeStep:                     0.1

        alwaysCaptureHotkeys:           true
        captureDocumentHotkeys:         false                                   # Capture document keydown events even if the player does not have focus (default: false)
        hotkeysFocusElementFilter:      'function () { return false }'          # default
        enableFullscreen:               true
        enableHoverScroll:              true
        enableInactiveFocus:            true
        enableJogStyle:                 false
        enableMute:                     true
        enableModifiersForNumbers:      true
        enableNumbers:                  false
        enableVolumeScroll:             true
        skipInitialFocus:               false                                   # stops focusing the player on initial Play (default: false)

      skipButtons:
        enabled:                        true
        surroundPlayButton:             true

        backwardIndex:                  1
        forwardIndex:                   1
        forward:                        10
        backward:                       10

      nextPrevButtons:
        enabled:                        true
        autoplay:                       true                                    # play video after load

      zoomButtons:
        enabled:                        true

        moveX:                          0
        moveY:                          0
        rotate:                         0
        zoom:                           1

# ------------------------------------------------------------------------------
# END config