# ==============================================================================
# Description
# ==============================================================================
#
description:
  title:                                Justified Gallery
  scope:                                User control settings
  location:                             _data/gallery_control.yml

# ==============================================================================
# User configuration settings
# ==============================================================================
#
settings:

  # ============================================================================
  # GENERAL options
  # ----------------------------------------------------------------------------
  #
  enabled:                              true

  # ============================================================================
  # All galleries available
  # ----------------------------------------------------------------------------
  #
  galleries:

    # ==========================================================================
    # Image Galleries
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # Old Times
    #
    - gallery:
      enabled:                          true

      id:                               jg_old_times
      type:                             image
      image_base_path:                  /assets/image/module/gallery/old_time/image/grand_pa

      # ------------------------------------------------------------------------
      # Justified Gallery settings (override: defaults are 150 / 1)
      #
      gallery_options:
        rowHeight:                      250
        gutters:                        3

      # ------------------------------------------------------------------------
      # Lightbox settings
      #
      lightbox:
        type:                           ps                                      # ps | lb | lg

      lightGallery:
        plugins:                        lgFullscreen, lgRotate, lgThumbnail

    # --------------------------------------------------------------------------
    # Gallery Mega Cities
    #
    - gallery:
      enabled:                          true

      id:                               jg_mega_cities
      type:                             image
      image_base_path:                  /assets/image/module/swiper/simple/mega_city/image

      # ------------------------------------------------------------------------
      # Lightbox settings
      #
      lightbox:
        type:                           ps                                      # ps | lb | lg

      lightGallery:
        plugins:                        lgFullscreen, lgRotate, lgThumbnail, lgZoom
        options:
          animateThumb:                 false                                     # override (default: true)
          addClass:                     lg-uno-thumbnails                         # customized thumbnails
          appendThumbnailsTo:           .lg-outer                                 # required for customized thumbnails
          allowMediaOverlap:            true                                      # required for customized thumbnails

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                         # override (default: 1)

    # ==========================================================================
    # Video Galleries
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # HTML5 VIDEO
    #
    - gallery:
      enabled:                          true

      id:                               jg_video_html5
      type:                             video
      video:                            html5
      video_base_path:                  /assets/video/html5
      image_base_path:                  /assets/video/poster/html5
      thumb_base_path:                  /assets/video/poster/html5

      # ------------------------------------------------------------------------
      # Justified Gallery settings (override: defaults are 150 / 1)
      #
      gallery_options:
        rowHeight:                      250
        gutters:                        3

      lightGallery:
        options:
          videojs:                      true                                    # override (default: false)
          videojsTheme:                 vjs-theme-uno                           # net-new (not in defaults)

        videojsOptions:
          enabled:                      true                                    # override (default: false)
          tracks:                       true                                    # net-new (not in defaults)

          hotKeysPlugin:                                                        # net-new key/placement (default uses controlBar.hotkeysPlugin)
            enabled:                    true
            options:
              volumeStep:               0.2

          controlBar:
            skipButtonsPlugin:
              options:
                forward:                5                                       # override (default: 15)
                backward:               5                                       # override (default: 15)
                backwardIndex:          0                                       # net-new
                forwardIndex:           1                                       # net-new

            zoomPlugin:
              showZoom:                 true                                    # net-new
              showMove:                 false                                   # net-new
              showRotate:               false                                   # net-new
              gestureHandler:           false                                   # net-new

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                       # override (default: 1)
        contrast:                       1                                       # override (default: 0.8)
        brightness:                     1                                       # override (default: 0.4)

    # --------------------------------------------------------------------------
    # Online VIDEO Carpool Karaoke (YouTube)
    #
    - gallery:
      enabled:                          true

      id:                               jg_video_youtube_james_and_adele
      type:                             video
      video:                            youtube
      image_base_path:                  //img.youtube.com/vi

      # ------------------------------------------------------------------------
      # Justified Gallery settings (override: defaults are 150 / 1)
      #
      gallery_options:
        rowHeight:                      250
        gutters:                        3

      lightGallery:
        options:
          videojs:                      true                                    # override (default: false)
          videojsTheme:                 vjs-theme-uno                           # net-new (not in defaults)

        videojsOptions:
          enabled:                      true                                    # override (default: false)
          tracks:                       false                                   # net-new (not in defaults)

          hotKeysPlugin:                                                        # net-new key/placement
            enabled:                    true
            options:
              volumeStep:               0.2

          controlBar:
            skipButtonsPlugin:
              options:
                forward:                5                                       # override (default: 15)
                backward:               5                                       # override (default: 15)
                backwardIndex:          0                                       # net-new
                forwardIndex:           1                                       # net-new

            zoomPlugin:
              enabled:                  false                                   # override (default: true)

        playerParams:                                                           # net-new block (not in defaults)
          enabled:                      true
          # start:                      ["00:00:50", "00:00:50"]                # start time video1, vido2
          autoplay:                     1                                       # autoplay = 1 only available for YouTube when muted.
          # controls:                   1                                       # default = 0
          # enablejsapi:                1                                       # default = 1
          # hl:                         en                                      # default = en
          # loop:                       0                                       # default = 0
          mute:                         0                                       # default = 1
          # playsinline:                1                                       # for mobile|iOS only
          # wmode:                      opaque                                  # default = opaque

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                       # override (default: 1)
        contrast:                       1                                       # override (default: 0.8)
        brightness:                     1                                       # override (default: 0.4)

    # --------------------------------------------------------------------------
    # HTML5 VIDEO (over VideoJS)
    #
    - gallery:
      enabled:                          true

      id:                               jg_video_html5_videojs
      type:                             video
      video:                            html5
      video_base_path:                  /assets/video/html5
      image_base_path:                  /assets/video/poster/html5
      thumb_base_path:                  /assets/video/poster/html5

      # ------------------------------------------------------------------------
      # Justified Gallery settings (override: defaults are 150 / 1)
      #
      gallery_options:
        rowHeight:                      250
        gutters:                        3

      lightGallery:
        options:
          videojs:                      true                                    # override (default: false)
          videojsTheme:                 vjs-theme-uno                           # net-new (not in defaults)

        videojsOptions:
          enabled:                      true                                    # override (default: false)

          hotKeysPlugin:                                                        # net-new key/placement
            enabled:                    true
            options:
              volumeStep:               0.2

          controlBar:
            skipButtonsPlugin:
              options:
                forward:                5                                       # override (default: 15)
                backward:               5                                       # override (default: 15)
                backwardIndex:          0                                       # net-new
                forwardIndex:           1                                       # net-new

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                       # override (default: 1)
        contrast:                       1                                       # override (default: 0.8)
        brightness:                     1                                       # override (default: 0.4)

    # --------------------------------------------------------------------------
    # TinyDesk Concerts, Latin (YouTube)
    #
    - gallery:
      enabled:                          true

      id:                               tdc_latin
      type:                             video
      video:                            youtube
      image_base_path:                  //img.youtube.com/vi

      # ------------------------------------------------------------------------
      # Justified Gallery settings (override: defaults are 150 / 1)
      #
      gallery_options:
        rowHeight:                      250
        gutters:                        3

      lightGallery:
        options:
          videojs:                      true                                    # override (default: false)
          videojsTheme:                 vjs-theme-uno                           # net-new (not in defaults)

        videojsOptions:
          enabled:                      true                                    # override (default: false)

          hotKeysPlugin:                                                        # net-new key/placement
            enabled:                    true
            options:
              volumeStep:               0.2

          controlBar:
            skipButtonsPlugin:
              options:
                forward:                5                                       # override (default: 15)
                backward:               5                                       # override (default: 15)
                backwardIndex:          0                                       # net-new
                forwardIndex:           1                                       # net-new

            zoomPlugin:
              enabled:                  false                                   # override (default: true)

        playerParams:                                                           # net-new block (not in defaults)
          enabled:                      true
          autoplay:                     1                                       # autoplay = 1 only available for YouTube when muted.
          mute:                         0                                       # default = 1

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                       # override (default: 1)
        contrast:                       1                                       # override (default: 0.8)
        brightness:                     1                                       # override (default: 0.4)


    # ==========================================================================
    # Video Galleries over PhotoSwipe
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # HTML5 VIDEO (over PhotoSwipe)
    #
    - gallery:
      enabled:                          true

      id:                               jg_video_html5_pswp
      type:                             video
      video:                            html5
      video_base_path:                  /assets/video/html5
      image_base_path:                  /assets/video/poster/html5
      thumb_base_path:                  /assets/video/poster/html5

      # ------------------------------------------------------------------------
      # Justified Gallery settings (override: defaults are 150 / 1)
      #
      gallery_options:
        rowHeight:                      250
        gutters:                        3

      # ------------------------------------------------------------------------
      # Lightbox settings is kept.
      #
      lightbox:
        type:                           ps                                      # ps | lb | lg

      # ------------------------------------------------------------------------
      # PhotoSwipe settings
      #
      photoswipe:

        plugin:
          fullscreen:                   false                                   # per-gallery opt-in (site-wide default: see defaults/photoswipe.yml)
#         caption:                      true                                    # per-gallery opt-in/out (site-wide default: see defaults/photoswipe.yml)

        videoOptions:
          enabled:                      true                                    # opt-in (default: false)

          autoplay:                     startOnFirst                            # restated (default: startOnFirst)

          videoAttributes:
            muted:                      false                                   # override (default: '' = muted)

          videojs:
            plugins:
              skipButtons:
                options:
                  forward:              5                                       # override (default: 15)
                  backward:             5                                       # override (default: 15)

              zoomButtons:
                enabled:                true                                    # restated (default: true)

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                       # override (default: 1)
        contrast:                       1                                       # override (default: 0.8)
        brightness:                     1                                       # override (default: 0.4)


    # --------------------------------------------------------------------------
    # TinyDesk Concerts, Latin (YouTube, over PhotoSwipe)
    #
    - gallery:
      enabled:                          true

      id:                               tdc_latin_pswp
      type:                             video
      video:                            youtube
      image_base_path:                  //img.youtube.com/vi

      # ------------------------------------------------------------------------
      # Justified Gallery settings (override: defaults are 150 / 1)
      #
      gallery_options:
        rowHeight:                      250
        gutters:                        3

      # ------------------------------------------------------------------------
      # Lightbox settings
      #
      lightbox:
        type:                           ps                                      # ps | lb | lg

      photoswipe:

        plugin:
          fullscreen:                   true                                    # per-gallery opt-in (site-wide default: see defaults/photoswipe.yml)

        videoOptions:
          enabled:                      true                                    # opt-in (default: false)

          preventDragOffset:            56                                      # override (default: 40)

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                       # override (default: 1)
        contrast:                       1                                       # override (default: 0.8)
        brightness:                     1                                       # override (default: 0.4)

    - gallery:
      enabled:                          true

      id:                               jg_video_youtube_pswp
      type:                             video
      video:                            youtube
      image_base_path:                  //img.youtube.com/vi

      # ------------------------------------------------------------------------
      # Justified Gallery settings (override: defaults are 150 / 1)
      #
      gallery_options:
        rowHeight:                      250
        gutters:                        3

      # ------------------------------------------------------------------------
      # Lightbox settings
      #
      lightbox:
        type:                           ps                                      # ps | lb | lg

      photoswipe:

        plugin:
          fullscreen:                   true                                    # per-gallery opt-in (site-wide default: see defaults/photoswipe.yml)

        videoOptions:
          enabled:                      true                                    # opt-in (default: false)

          autoplay:                     startOnFirst                            # restated (default: startOnFirst)
          preventDragOffset:            56                                      # override (default: 40)

          videoAttributes:
            muted:                      false                                   # override (default: '' = muted)

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                       # override (default: 1)
        contrast:                       1                                       # override (default: 0.8)
        brightness:                     1                                       # override (default: 0.4)

# ------------------------------------------------------------------------------
# END config