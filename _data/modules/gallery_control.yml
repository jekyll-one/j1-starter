# ==============================================================================
# Description
#
description:
  title:                                Justified Gallery
  scope:                                User control settings
  location:                             _data/gallery_control.yml

# ==============================================================================
# User configuration settings
# ------------------------------------------------------------------------------
#
settings:

  # ============================================================================
  # All galleries available
  # ----------------------------------------------------------------------------
  #
  galleries:

    # ==========================================================================
    # Image Galleries
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # Gallery Manager
    #
    - gallery:

      # ------------------------------------------------------------------------
      # GENERAL settings
      #
      enabled:                          true

      # ------------------------------------------------------------------------
      # GALLERY settings
      #
      id:                               galleryManager
      type:                             image
      image_base_url:                   /assets/image                           # http://localhost:11000

      # ------------------------------------------------------------------------
      # STORAGE settings
      #
      storage:
        enabled:                        true
        preload:                        false

      # ------------------------------------------------------------------------
      # UI settings
      #
      manage:
        enabled:                        true
        title:                          Gallery Manager
        showItemTools:                  true
        dropSettingsMenu:               true
        dropBasePath:                   module/gallery

      # ------------------------------------------------------------------------
      # SEARCH settings
      #
      search:
        enabled:                        true
        type:                           simpleSearch

      # ------------------------------------------------------------------------
      # LIGHTBOX settings
      #
      lightbox:
        enabled:                        true
        type:                           ps                                      # ps -> photoswipe

      # LIGHTBOX options
      #
      photoswipe:
        auto_detect_size:               true

    # --------------------------------------------------------------------------
    # Gallery Mega Cities
    #
    - gallery:

      # ========================================================================
      # GENERAL options
      # ------------------------------------------------------------------------
      #
      enabled:                          true

      id:                               jgMegaCities
      type:                             image

      image_base_url:                   /assets/image/module/gallery/mega_city

      # ------------------------------------------------------------------------
      # STORAGE|UI settings
      #
      storage:
        enabled:                        true                                    # opt-in (default: false)
        preload:                        false                                   # jgMegaCities.json

      manage:
        enabled:                        false                                    # opt-in (default: false)
        title:                          Mega Cities                             # header title (default: gallery id)
        dropSettingsMenu:               true                                    # toggle menu (top right) to change image_base_url|dropBasePath at runtime
        dropBasePath:                   none

      # ------------------------------------------------------------------------
      # LIGHTBOX settings
      #
      lightbox:
        type:                           ps                                      # ps | lb | lg

      # lightGallery:
      #   plugins:                        lgFullscreen, lgRotate, lgThumbnail, lgZoom

      #   options:
      #     animateThumb:                 false                                   # override (default: true)
      #     addClass:                     lg-uno-thumbnails                       # customized thumbnails
      #     appendThumbnailsTo:           .lg-outer                               # required for customized thumbnails
      #     allowMediaOverlap:            true                                    # required for customized thumbnails

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      # filters:
      #   grayscale:                      0                                       # override (default: 1)


    # ==========================================================================
    # Video Galleries
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # HTML5 VIDEO (jg_video_html5)
    #
    - gallery:
      enabled:                          true

      id:                               jg_video_html5
      type:                             video
      video:                            html5
      video_base_path:                  /assets/video/html5
      image_base_url:                   /assets/video/poster/html5
      thumb_base_path:                  /assets/video/poster/html5

      # ------------------------------------------------------------------------
      # Justified Gallery settings
      #
      gallery_options:
        rowHeight:                      250                                     # override (default: 150)
        gutters:                        3                                       # override (default: 1)

      # ------------------------------------------------------------------------
      # Lightbox|lightGallery settings
      #
      lightGallery:
        options:
          videojs:                      true                                    # override (default: false)
          videojsTheme:                 vjs-theme-uno                           # net-new (not in defaults)

        videojsOptions:
          enabled:                      true                                    # override (default: false)
          tracks:                       true                                    # net-new (not in defaults)

          hotKeysPlugin:                                                        # net-new key/placement (default uses controlBar.hotkeysPlugin)
            enabled:                    true
            options:
              volumeStep:               0.2

          controlBar:
            skipButtonsPlugin:
              options:
                forward:                5                                       # override (default: 15)
                backward:               5                                       # override (default: 15)
                backwardIndex:          0                                       # net-new
                forwardIndex:           1                                       # net-new

            zoomPlugin:
              showZoom:                 true                                    # net-new
              showMove:                 false                                   # net-new
              showRotate:               false                                   # net-new
              gestureHandler:           false                                   # net-new

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                       # override (default: 1)
        contrast:                       1                                       # override (default: 0.8)
        brightness:                     1                                       # override (default: 0.4)

    # --------------------------------------------------------------------------
    # HTML5 VIDEO over PhotoSwipe (jg_video_html5_pswp)
    #
    - gallery:
      enabled:                          true

      id:                               jg_video_html5_pswp
      type:                             video
      video:                            html5
      video_base_path:                  /assets/video/html5
      image_base_url:                   /assets/video/poster/html5
      thumb_base_path:                  /assets/video/poster/html5

      # ------------------------------------------------------------------------
      # STORAGE settings
      #
      storage:
        enabled:                        false
        preload:                        false

      # ------------------------------------------------------------------------
      # UI settings
      #
      manage:
        enabled:                        false
        title:                          Local Video
        showItemTools:                  true
        dropSettingsMenu:               true                                    # toggle menu (top right) to change image_base_url|dropBasePath at runtime

        dropBasePath:                                                           # relative to image_base_url

      # ------------------------------------------------------------------------
      # Justified Gallery settings
      #
      gallery_options:
        rowHeight:                      250                                     # override (default: 150)
        gutters:                        3                                       # override (default: 1)

      # ------------------------------------------------------------------------
      # LIGHTBOX settings
      #
      lightbox:
        type:                           ps                                      # ps | lb | lg

      # ------------------------------------------------------------------------
      # PhotoSwipe settings
      #
      photoswipe:

        plugin:
          fullscreen:                   false                                   # per-gallery opt-in|out (site-wide default: defaults/photoswipe.yml)
          caption:                      true                                    # per-gallery opt-in|out (site-wide default: defaults/photoswipe.yml)

        # captionOptions:
        #   type:                       below
        #   portraitPadding:            50

        # fullscreenOptions:
        #   enabled:                    true
        #   fullscreenTitle:            Toggle fullscreen
        #   fullscreenOnDoubleTap:      false                                   # opt-in (default: false)
        #   doubleClickDelay:           300                                     # ms, 0..2000 (default: 300)

        videoOptions:
          enabled:                      true                                    # opt-in (default: false)

          autoplay:                     startOnFirst                            # restated (default: startOnFirst)

          videoAttributes:
            muted:                      false                                   # override (default: '' = muted)

          videojs:
            plugins:
              skipButtons:
                options:
                  forward:              5                                       # override (default: 15)
                  backward:             5                                       # override (default: 15)

              zoomButtons:
                enabled:                true                                    # restated (default: true)

              videoFilters:
                enabled:                true                                    # net-new (plugin not active by default)
                options:
                  persist:
                    scope:              player                                  # override (default: page)
                    key:                jg_video_html5_pswp                     # override (default: player id)

      # ------------------------------------------------------------------------
      # CSS filter options
      #
      filters:
        grayscale:                      0                                       # override (default: 1)
        contrast:                       1                                       # override (default: 0.8)
        brightness:                     1                                       # override (default: 0.4)

# ------------------------------------------------------------------------------
# END config