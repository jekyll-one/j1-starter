# ==============================================================================
# Description
#
description:
  title:                                Justified Gallery
  scope:                                User media settings
  location:                             _data/gallery_media.yml

# ==============================================================================
# User configuration settings
# ------------------------------------------------------------------------------
#
settings:

  # ============================================================================
  # All galleries available
  # ----------------------------------------------------------------------------
  #
  galleries:

    # ==========================================================================
    # Image Galleries
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # Gallery Manager
    #
    - gallery:
      id:                               galleryManager

      # ------------------------------------------------------------------------
      # Images (EMPTY on purpose)
      #
      images:

    # --------------------------------------------------------------------------
    # Gallery Mega Cities
    #
    - gallery:

      id:                               jgMegaCities

      # ------------------------------------------------------------------------
      # Images
      #
      images:

        # image 1
        - image:
          file:                         banter-snaps_b.jpg
          width:                        1280
          height:                       1920
          caption:                      Japan &middot; City of Osaka
          description: >
                                        <h2>Japan</h2>
                                        <h3>City of Osaka</h3>
        # image 2
        - image:
          file:                         denys-nevozhai-1_b.jpg
          width:                        1920
          height:                       1280          
          caption:                      China &middot; Man posing at the rooftop of Jin Mao Tower Shanghai
          description: >
                                        <h2>China</h2>
                                        <h3>Man posing at the rooftop of Jin Mao Tower Shanghai</h3>
        # image 3
        - image:
          file:                         gints-gailis_b.jpg
          width:                        1468
          height:                       1920          
          caption:                      Indonesia &middot; Shangri-La Hotel Jakarta
          description: >
                                        <h2>Indonesia</h2>
                                        <h3>Shangri-La Hotel Jakarta</h3>
        # image 4
        - image:
          file:                         steven-diaz_b.jpg
          width:                        1920
          height:                       1123          
          caption:                      Japan &middot; Tokyo seen from World Trade Center Observation Deck
          description: >
                                        <h2>Japan</h2>
                                        <h3>Tokyo seen from World Trade Center Observation Deck</h3>
        # image 5
        - image:
          file:                         denys-nevozhai-2_b.jpg
          width:                        1920
          height:                       1300          
          caption:                      China &middot; Young couple over Shenzhen
          description: >
                                        <h2>China</h2>
                                        <h3>Young couple over Shenzhen</h3>
        # image 6
        - image:
          file:                         johan-mouchet_b.jpg
          width:                        872
          height:                       1280          
          caption:                      Australia &middot; The Queen Bee at the Eureka Tower of Melbourne
          description: >
                                        <h2>Australia</h2>
                                        <h3>The Queen Bee at the Eureka Tower of Melbourne</h3>
        # image 7
        - image:
          file:                         thomas-tucker_b.jpg
          width:                        1600
          height:                       1050
          caption:                      Taiwan &middot; Sunset over City of Taipei
          description: >
                                        <h2>Taiwan</h2>
                                        <h3>Sunset over City of Taipei</h3>
        # image 8
        - image:
          file:                         emmad-mazhari_b.jpg
          width:                        1920
          height:                       1822
          caption:                      United States &middot; City of Chicago
          description: >
                                        <h2>United States</h2>
                                        <h3>City of Chicago</h3>
        # image 9
        - image:
          file:                         andreas-brucker_b.jpg
          width:                        1920
          height:                       1280
          caption:                      Thailand &middot; City of Bangkok
          description: >
                                        <h2>Thailand</h2>
                                        <h3>City of Bangkok</h3>


    # ==========================================================================
    # Video Galleries
    # --------------------------------------------------------------------------

    # ==========================================================================
    # Video Galleries over lightGallery (lg)
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # HTML5 VIDEO (jg_video_html5)
    #
    - gallery:
      id:                               jg_video_html5

      # ------------------------------------------------------------------------
      # Video settings
      # ------------------------------------------------------------------------
      #
      videos:

        - video:                        # video 1
          enabled:                      true

          name:                         Peck Pocketed
          type:                         html5
          api:                          videojs                                 # jadams !!!
          size:                         1280-720
          source:                       peck_pocketed.mp4
          poster_image:                 peck_pocketed.jpg
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          caption:                 Peck Pocketed &middot; Student Academy Award winning Cartoon Clip
          description: >
                                        <h2>Peck Pocketed by Kevin Herron | Disney Favorite</h2>
                                        <h3>Student Academy Award winning Cartoon Clip</h3>

          tracks:
            - track:
              default:                  true
              kind:                     captions
              srclang:                  en
              label:                    English
              src:                      /assets/video/tracks/html5/peck_pocketed/captions/video.vtt

            - track:
              default:                  true
              kind:                     chapters
              srclang:                  en
              label:                    Chapters
              src:                      /assets/video/tracks/html5/peck_pocketed/chapters/video.vtt

        - video:                        # video 2
          enabled:                      true

          name:                         Rollin Wild
          type:                         html5
          api:                          videojs                                 # jadams !!!
          size:                         1280-720
          source:                       rolling_wild.mp4
          poster_image:                 rolling_wild.jpg
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          caption:                 Rollin` Wild &middot; Short Funny animated video clip created at the Film Academy
          description: >
                                        <h2>Rollin` Wild</h2>
                                        <h3>Short Funny Animated Clip created at the Film Academy</h3>

          tracks::                      []


    # ==========================================================================
    # Video Galleries over PhotoSwipe Lightbox (ps)
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # HTML5 VIDEO jg_video_html5_pswp
    #
    - gallery:
      id:                               jg_video_html5_pswp

      # ------------------------------------------------------------------------
      # Video settings
      # ------------------------------------------------------------------------
      #
      videos:

        - video:                        # video 1
          enabled:                      true

          name:                         Peck Pocketed
          type:                         html5
          api:                          videojs
          size:                         1280-720
          source:                       peck_pocketed.mp4
          poster_image:                 peck_pocketed.jpg
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          caption:                      Peck Pocketed &middot; Student Academy Award winning Cartoon Clip
          description: >
                                        <h2>Peck Pocketed by Kevin Herron | Disney Favorite</h2>
                                        <h3>Student Academy Award winning Cartoon Clip</h3>

          tracks:
            - track:
              default:                  true
              kind:                     captions
              srclang:                  en
              label:                    English
              src:                      /assets/video/tracks/html5/peck_pocketed/captions/video.vtt

            - track:
              default:                  true
              kind:                     chapters
              srclang:                  en
              label:                    Chapters
              src:                      /assets/video/tracks/html5/peck_pocketed/chapters/video.vtt

        - video:                        # video 2
          enabled:                      true

          name:                         Rollin Wild
          type:                         html5
          api:                          videojs
          size:                         1280-720
          source:                       rolling_wild.mp4
          poster_image:                 rolling_wild.jpg
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          caption:                      Rollin` Wild &middot; Short Funny animated video clip created at the Film Academy
          description: >
                                        <h2>Rollin` Wild</h2>
                                        <h3>Short Funny Animated Clip created at the Film Academy</h3>

    # --------------------------------------------------------------------------
    # Online VIDEO jg_video_youtube_pswp
    #
    - gallery:
      id:                               jg_video_youtube_pswp

      # ------------------------------------------------------------------------
      # Video settings
      # ------------------------------------------------------------------------
      #
      videos:

        - video:                        # video 1
          enabled:                      true

          name:                         Dua Lipa
          type:                         youtube
          api:                          videojs
          size:                         1280-720
          source:                       //youtube.com/watch?v=y38qQRg3UDI
          poster_image:                 y38qQRg3UDI/maxresdefault.jpg
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          caption:                      Tiny Desk Concert &middot; Dua Lipa
          description: >
                                        <h2>Tiny Desk Concert</h2>
                                        <h3>Tiny Desk Concert at the NPR Headquarters, Washingtom DC (2021-01-28)</h3>

        - video:                        # video 2
          enabled:                      true

          name:                         Sabrina Carpenter
          type:                         youtube
          api:                          videojs
          size:                         1280-720
          source:                       //youtube.com/watch?v=BEoGvTlJMyY
          poster_image:                 BEoGvTlJMyY/maxresdefault.jpg
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          caption:                      Tiny Desk Concert &middot; Sabrina Carpenter
          description: >
                                        <h2>Carpool Karaoke 2023</h2>
                                        <h3>Tiny Desk Concert at the NPR Headquarters, Washingtom DC (2024-12-20)</h3>

