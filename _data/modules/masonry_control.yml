# ------------------------------------------------------------------------------
# Description
#
description:
  caption:                              J1 Masonry
  scope:                                User control settings
  location:                             _data/modules/masonry_control.yml

# ------------------------------------------------------------------------------
# User configuration settings
#
settings:

  # ============================================================================
  # All galleries available
  # ----------------------------------------------------------------------------
  #
  galleries:

    # ==========================================================================
    # IMAGE GALLERIES
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    #  Gallery Mega Cities
    #
    - grid:

      # ------------------------------------------------------------------------
      # GLOBAL settings
      #    
      enabled:                          true

      id:                               maMegaCities
      type:                             image
      gutters:                          1

      image_base_path:                  /assets/image/module/gallery/mega_city

      # image_styles:                   img-fluid
      # image_height:                   300

      # ------------------------------------------------------------------------
      # LIGHTBOX settings
      #
      lightbox:
        enabled:                        true
        type:                           ps                                      # ps | lb | lg

        plugin:
          fullscreen:                   false


    # ==========================================================================
    # VIDEO GALLERIES
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # YouTube Videos (over PhotoSwipe)
    #
    - grid:

      # ------------------------------------------------------------------------
      # GLOBAL settings
      # 
      enabled:                          true

      id:                               youtube
      type:                             video
      gutters:                          2

      # ------------------------------------------------------------------------
      # Bootstrap responsive options
      #
      responsive:
        lg:                             6                                       # 2 elements per row (desktop)
        xl:                             6                                       # 2 elements per row (desktop)

      # ------------------------------------------------------------------------
      # VideoJS settings
      #
      videojs:

        # ----------------------------------------------------------------------
        # Player settings
        #
        player:

          # VideoJS settings
          # --------------------------------------------------------------------
          videojsPlayer:

            videojsOptions:

              controlBar:
                playbackRates:          [0.5, 1, 1.5]                           # currently NOT evaluated

              volumePanel:
                inline:                 true                                    # currently NOT evaluated

              skipButtonsPlugin:
                enabled:                false                                   # currently NOT evaluated
                options:
                  forward:              10                                      # currently NOT evaluated
                  backward:             10                                      # currently NOT evaluated

      # ------------------------------------------------------------------------
      # Lightbox settings (Photoswipe/ps)
      #
      lightbox:
        enabled:                        true
        type:                           ps                                      # ps | lb | lg

      # Photoswipe settimgs
      # ------------------------------------------------------------------------      
      photoswipe:

        # Plugin settimgs
        # ----------------------------------------------------------------------
        #
        plugin:
          fullscreen:                   false                                   # full-screen managed by the player (VJS)

        # Video settimgs
        # ----------------------------------------------------------------------
        #
        videoOptions:
          enabled:                      true                                    # opt-in (default: false)
          autoplay:                     startOnFirst                            # tbc: start video on slide change (startOnSlideChanged)
          preventDragOffset:            56                                      # override (default: 40)

# ------------------------------------------------------------------------------
# END config