# ------------------------------------------------------------------------------
# Description
#
description:
  caption:                              J1 Masonry
  scope:                                User media settings
  location:                             _data/modules/masonry_media.yml

# ------------------------------------------------------------------------------
# User configuration settings
#
settings:

  # ----------------------------------------------------------------------------
  # GENERAL options
  # ----------------------------------------------------------------------------
  #
  enabled:                              true

  # ----------------------------------------------------------------------------
  # All playlists available
  # ----------------------------------------------------------------------------
  players:

    # --------------------------------------------------------------------------
    # IMAGE
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # Images + Fixed Height + Gutters + Captions + Lightbox
    #
    - grid:
      enabled:                          true

      id:                               image_fixed_height_lb

      # ------------------------------------------------------------------------
      # Images
      #
      images:

        # image 1
        - image:
          file:                         denys-nevozhai-1_b.jpg
          width:                        5401
          height:                       3601           
          caption:                      Man posing at the rooftop of Jin Mao Tower Shanghai - China

        # image 2
        - image:
          file:                         thomas-tucker_b.jpg
          width:                        1600
          height:                       1050          
          caption:                      Sunset over Taipei City - Taiwan

        # image 3
        - image:
          file:                         emmad-mazhari_b.jpg
          width:                        1920
          height:                       1822          
          caption:                      Chicago - United States

        # image 4
        - image:
          file:                         johan-mouchet_b.jpg
          width:                        1920
          height:                       2880           
          caption:                      The Queen Bee at the Eureka Tower - Melbourne Southbank Australia

        # image 5
        - image:
          file:                         federico-rizzarelli_b.jpg
          width:                        1920
          height:                       2880          
          caption:                      Shanghai - China

        # image 6
        - image:
          file:                         gints-gailis_b.jpg
          width:                        1440
          height:                       1861           
          caption:                      Shangri-La Hotel Jakarta - Indonesia


    # --------------------------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # YouTube
    #
    - grid:
      enabled:                          true

      id:                               youtube

      # ------------------------------------------------------------------------
      # videos
      #
      videos:

        # video 1
        # ----------------------------------------------------------------------
        - video:
          name:                         Tiny Desk Concert - Dua Lipa
          type:                         youtube
          api:                          videojs
          size:                         1280-720
          source:                       //youtube.com/y38qQRg3UDI
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          description: >
                                        <h2>Tiny Desk Concert - Dua Lipa<h2>
                                        <h3>
                                          Tiny Desk Concert at the NPR Headquarters, Washingtom DC (2021-01-28)
                                        </h3>
          poster:
            style:                      img-responsive
            source:                     //img.youtube.com/vi/y38qQRg3UDI/maxresdefault.jpg

          caption:
            enabled:                    true
            position:                   bottom
            text:                       Tiny Desk Concert &middot; Dua Lipa

        # video 2
        # ----------------------------------------------------------------------
        - video:
          name:                         Tiny Desk Concert - Sabrina Carpenter
          type:                         youtube
          api:                          videojs
          size:                         1280-720
          source:                       //youtube.com/BEoGvTlJMyY
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          description: >
                                        <h2>Tiny Desk Concert - Sabrina Carpenter</h2>
                                        <h3>
                                          Tiny Desk Concert at the NPR Headquarters, Washingtom DC (2024-12-20)
                                        </h3>
          poster:
            style:                      img-responsive
            source:                     //img.youtube.com/vi/BEoGvTlJMyY/maxresdefault.jpg

          caption:
            enabled:                    true
            position:                   bottom
            text:                       Tiny Desk Concert &middot; Sabrina Carpenter

# ------------------------------------------------------------------------------
# END config