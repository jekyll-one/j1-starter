    # Gallery Mega Cities
    #
    - grid:

      # ------------------------------------------------------------------------
      # GLOBAL settings
      #
      id:                               maMegaCities

      # ------------------------------------------------------------------------
      # IAAGE settings
      #
      images:

        # image 1
        - image:
          file:                         banter-snaps_b.jpg
          width:                        1280
          height:                       1920
          caption:                      Japan &middot; City of Osaka
          description: >
                                        <h2>Japan</h2>
                                        <h3>City of Osaka</h3>
        # image 2
        - image:
          file:                         denys-nevozhai-1_b.jpg
          width:                        1920
          height:                       1280          
