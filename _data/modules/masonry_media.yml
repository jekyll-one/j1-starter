# ------------------------------------------------------------------------------
# Description
#
description:
  caption:                              J1 Masonry
  scope:                                User media settings
  location:                             _data/modules/masonry_media.yml

# ------------------------------------------------------------------------------
# User configuration settings
#
settings:

  # ----------------------------------------------------------------------------
  # GENERAL options
  # ----------------------------------------------------------------------------
  #
  enabled:                              true

  # ----------------------------------------------------------------------------
  # All players available
  # ----------------------------------------------------------------------------
  players:

    # --------------------------------------------------------------------------
    # IMAGE PLAYERS
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # Images + Fixed Height + Gutters + Captions + Lightbox
    #
    - grid:
      enabled:                          true

      id:                               image_fixed_height_lb

      # ------------------------------------------------------------------------
      # Images
      #
      images:

        # image 1
        - image:
          file:                         denys-nevozhai-1_b.jpg
          width:                        5401
          height:                       3601           
          caption:                      Man posing at the rooftop of Jin Mao Tower Shanghai - China

        # image 2
        - image:
          file:                         thomas-tucker_b.jpg
          width:                        1600
          height:                       1050          
          caption:                      Sunset over Taipei City - Taiwan

        # image 3
        - image:
          file:                         emmad-mazhari_b.jpg
          width:                        1920
          height:                       1822          
          caption:                      Chicago - United States

        # image 4
        - image:
          file:                         johan-mouchet_b.jpg
          width:                        1920
          height:                       2880           
          caption:                      The Queen Bee at the Eureka Tower - Melbourne Southbank Australia

        # image 5
        - image:
          file:                         federico-rizzarelli_b.jpg
          width:                        1920
          height:                       2880          
          caption:                      Shanghai - China

        # image 6
        - image:
          file:                         gints-gailis_b.jpg
          width:                        1440
          height:                       1861           
          caption:                      Shangri-La Hotel Jakarta - Indonesia


    # --------------------------------------------------------------------------
    # VIDEO PLAYERS
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # YouTube Videos
    #
    - grid:
      enabled:                          true

      id:                               youtube

      # ------------------------------------------------------------------------
      # videos
      #
      videos:

        # video 1
        # ----------------------------------------------------------------------
        - video:
          name:                         Carpool Karaoke P!nk
          type:                         youtube
          api:                          videojs
          size:                         1280-720
          source:                       //youtube.com/sottGW1p5os
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          description: >
                                        <h2>Carpool Karaoke - P!nk<h2>
                                        <h3>
                                          James enlists some commuting help from P!nk, driving around
                                          Los Angeles singing her classics, and the two end upside down 
                                          to prove once and for all you can sing better inverted.
                                        </h3>
          poster:
            style:                      img-responsive
            source:                     //img.youtube.com/vi/sottGW1p5os/mqdefault.jpg

          caption:
            enabled:                    true
            position:                   bottom
            text:                       YouTube Video &middot; Pink

        # video 2
        # ----------------------------------------------------------------------
        - video:
          name:                         Carpool Karaoke Gwen Stefani
          type:                         youtube
          api:                          videojs
          size:                         1280-720
          source:                       //youtube.com/F2SXmzk8ve4
          pinterest_prefix:             Pin video
          tweet_prefix:                 Try video
          description: >
                                        <h2>Carpool Karaoke - Gwen Stefani</h2>
                                        <h3>
                                          Gwen Stefani, Carpool Karaoke with George
                                          Clooney and Julia Roberts
                                        </h3>
          poster:
            style:                      img-responsive
            source:                     //img.youtube.com/vi/F2SXmzk8ve4/mqdefault.jpg

          caption:
            enabled:                    true
            position:                   bottom
            text:                       YouTube Video &middot; Gwen Stefani

# ------------------------------------------------------------------------------
# END config