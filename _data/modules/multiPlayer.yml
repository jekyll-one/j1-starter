# ------------------------------------------------------------------------------
# Description
#
description:
  title:                                J1 MultiPlayer
  scope:                                User settings
  location:                             _data/modules/multiPlayer.yml

# ------------------------------------------------------------------------------
# User configuration settings (all players)
#
settings:

  # GENERAL settings
  #
  enabled:                              true

  # Fix multiPlayer new select audio only #1
  # AUDIO ONLY playback (all players)
  #
  # Applies to YOUTUBE entries only; native .mp3/.mp4 sources are never
  # affected. When active, the module follows the strategy of the Amplitude
  # module's ytp plugin (yt_player: height|width 0, quality small): the
  # video is not shown and the amount of video data loaded is reduced to
  # the minimum — only the audio plays.
  #
  # The key seeds the INITIAL state of the per-player title-bar switch
  # (div#audioOnlySwitch_<player_id>, placed after the playlistModeSwitch);
  # a user toggle is persisted per player (localStorage 'audioOnly_<id>')
  # and, once present, wins over this seed. A per-player 'audio_only' entry
  # in multiPlayer_control.yml overloads this global value.
  #
  audio_only:                           false

  # claude - Fix multiPlayer new select audio only 4
  # FIXED AUDIO ONLY playback for players WITHOUT the title-bar switch
  #
  # Companion of 'audio_only' above. Where 'audio_only' SEEDS the switch (and
  # is overruled by the first user toggle), 'set_audio_only' STATES the mode
  # for players that show no switch at all, so a viewer who cannot toggle is
  # never governed by a stale toggle left in localStorage.
  #
  # The key is read ONLY when the switch is not shown or is unavailable:
  #
  #   - ui_elements.audioOnlySwitch is false (the documented case), or
  #   - the player is disabled, or the playlist is disabled, or the rendered
  #     markup carries no playlist title bar the switch could be built into
  #
  # While the control is reachable it owns the state and this key is ignored
  # completely — the switch precedence (localStorage <- audio_only <- false)
  # then applies unchanged.
  #
  #   true      YouTube entries always play audio only
  #   false     YouTube entries always play with video
  #   (absent)  no opinion — behaviour identical to before this fix
  #
  # Same three-layer inheritance as every other key: defaults <- user
  # settings <- per-player entries in multiPlayer_control.yml.
  #
  set_audio_only:                       false

  # Per-media value edited in the player's Edit Media Settings dialog
  # (fields "Start At"/"End At") or shipped in a preloaded playlist JSON,
  # then the YAML chain: defaults <- user settings <- per-player entries
  #
  # startAt:                            ""
  # endAt:                              ""
  #
  # Extend multiPlayer for new startAtDarkCheck param #1
  # PLAYBACK WINDOW (all players). Now declared active, so the keys are
  # available on all three layers. Values: hh:mm:ss, mm:ss or seconds;
  # "" = no window (identical to the commented form above). A per-player
  # entry in multiPlayer_control.yml overloads these values; a per-media
  # value from the Edit Media Settings dialog wins over both.
  #
  startAt:                              ""
  endAt:                                ""

  # Extend multiPlayer for new startAtDarkCheck param #1
  # DARK START of the playback window (all players, see
  # defaults/multiPlayer.yml for the full note).
  #
  #   true      the video stays dark (poster shown) until startAt is reached
  #   false     the video is shown from the first frame (default)
  #
  # A per-player 'startAtDarkCheck' entry in multiPlayer_control.yml
  # overloads this global value.
  #
  startAtDarkCheck:                     false

  # PLAYLIST settings
  #
  playlist:
    enabled:                            true

    cards:
      perRow:                           2

  # Modify J1 VideoPlayerfor export #1
  # UI interface settings (all players)
  #
  # MEDIA EXPORT switches. Both default to TRUE when the keys are absent, so
  # existing configurations need no change. The controls are additionally
  # SELF-HIDING: they only ever appear for playlist items that resolve to a
  # plain .mp3 or .mp4 file, so a YouTube-only player shows no export UI even
  # with both switches on. Set a key to false to suppress the control for ALL
  # players; a per-player entry in videoPlayer_control.yml always wins.
  #
  #   playlist_download_button      - the per-item button in the playlist row
  #                                   (div.playlist-row-content) and card
  #                                   (div.playlist-card-actions)
  #   playlist_download_all_button  - the playlist-level button in the title
  #                                   bar (div.playlist-block-title); exports
  #                                   every downloadable item of the ACTIVE
  #                                   playlist (a running search narrows the
  #                                   set to the visible result)
  #
  ui_elements:
    playlist_download_button:           true
    playlist_download_all_button:       true

    # Fix multiPlayer new select audio only #1
    # AUDIO ONLY switch visibility (all players). Defaults to TRUE when the
    # key is absent, so existing configurations need no change. The control
    # is additionally SELF-HIDING: it only ever appears when the playlist
    # holds at least one YouTube entry, so a native-only (.mp3/.mp4) player
    # shows no audio-only UI even with the switch on — the exact inverse of
    # the export controls above. Set to false to suppress the control for
    # ALL players; a per-player entry in multiPlayer_control.yml always wins.
    #
    audioOnlySwitch:                    true

  # VideoJS - Extend plugin zoom #4
  # VIDEOJS settings (all players)
  #
  # WHY THIS BLOCK EXISTS. The zoom gestures (#1) and the iPhone full-window
  # fallback (#3) were configured in _data/modules/videojs.yml. MultiPlayer
  # never reads that file: videojs.yml feeds the J1 VideoJS adapter
  # (j1.modules.videojs.options) and nothing else. Every videoJS.* value a
  # MultiPlayer uses comes from ITS OWN chain
  #
  #   _data/modules/defaults/multiPlayer.yml   defaults.videoJS
  #     <- _data/modules/multiPlayer.yml       settings.videoJS   (this file)
  #       <- _data/modules/multiPlayer_control.yml  players[].videoJS
  #
  # merged per player by getInstanceOptions() in adapter/js/multiPlayer.js and
  # read by player.js as videoPlayerOptions.videoJS. Because neither
  # `gestureHandler` nor `preferFullWindow` exists anywhere in that chain,
  # player.js handed `gestureHandler: undefined` to zoomButtons(), zoom.js
  # fell back to its default `false`, and the ZoomGesture component was never
  # added -- its constructor was never reached. The zoom BUTTONS kept working
  # because `zoomButtons.enabled` IS declared in the MultiPlayer defaults.
  #
  # Nothing is REMOVED: the file carried no videoJS block before. The chain
  # merges recursively, so every videoJS key that is not spelled out here
  # (zoomButtons.enabled, the gesture detail keys, players.native.playsinline,
  # fluid, ...) keeps the value of the MultiPlayer defaults resp. the plugin
  # default. A per-player videoJS block in multiPlayer_control.yml still wins
  # over this one, so gestures can be switched off for a single player.
  #
  videoJS:

    # VideoJS - Extend plugin zoom #4
    # PLAYER (tech) settings
    #
    players:

      native:
        # FULLSCREEN on iPhone (the #3 setting, now in the chain that is read).
        #
        # iPhone Safari (and every other browser on iOS) has no fullscreen for
        # a page element, only for the bare <video>. VideoJS then hands the
        # fullscreen button to the NATIVE player of the OS, and the VideoJS
        # player -- control bar, zoom panel, zoom gestures -- is gone for as
        # long as fullscreen lasts.
        #
        #   true    VideoJS uses its FULL-WINDOW mode instead: the player is
        #           pinned over the browser window and stays the VideoJS
        #           player, zoom panel and gestures included. The browser bars
        #           stay visible.
        #   false   the VideoJS default: the native OS player, without plugin.
        #
        # No effect on browsers with element fullscreen (desktop, Android,
        # iPad Safari): they never reach this fallback.
        #
        preferFullWindow:               true                                    # default: false

        # VideoJS - Extend plugin zoom #5
        # NETWORK RECOVERY for native sources (mp4, mp3, webm, ...).
        #
        # Large remote files are streamed in pieces (HTTP 206 Partial
        # Content). When the media server or the network closes such a
        # connection (console: ERR_CONNECTION_RESET, ERR_HTTP2_PROTOCOL_ERROR),
        # the browser stops the video. Chrome then often reports the error
        # as CODE:4 "format is not supported", although the file is fine.
        #
        # With recovery switched on, the player loads the file again after a
        # short pause, jumps back to the last position and continues playing.
        # The waiting time doubles with every attempt. After `maxRetries`
        # failed attempts the error screen is shown with a clearer message.
        #
        # Every key may be left out; the values shown are the built-in
        # defaults. YouTube videos are never affected.
        #
        networkRecovery:
          enabled:                      true                                    # default: true
          maxRetries:                   3                                       # default: 3   (0..10)
          retryDelay:                   1000                                    # default: 1000 ms, doubled per attempt
          progressReset:                10                                      # default: 10 s of playback restore the full budget

    # VideoJS - Extend plugin zoom #7
    # POSTER settings
    #
    # Playlist entries that point at a native media file (mp3/mp4/webm) and
    # carry no poster yet get one captured off-screen: a detached <video>
    # loads the file, seeks to a frame and stores it as a small image in the
    # playlist record. For a REMOTE file that capture is a second, parallel
    # download of the same file - and a media server that already serves a
    # running playback answers such a parallel request with a dropped
    # connection (the error the networkRecovery above then has to repair).
    #
    # `backfillWait` is the time such a capture waits for EVERY player of the
    # page to stop loading before it opens its own download. Local
    # (same-origin) files are never delayed, and an entry whose file is
    # currently loaded in a player is left out completely: its frame is
    # taken from the running playback instead.
    #
    #   10000   wait up to 10 seconds (the built-in default)
    #   0       never wait (the behaviour before this fix)
    #
    # Every other key of poster.autoGenerate (enabled, capturePosition,
    # captureFraction, maxWidth, mimeType, quality, generate_timeout) keeps
    # the value of the MultiPlayer defaults; the chain merges recursively.
    #
    poster:
      autoGenerate:
        backfillWait:                   10000                                   # default: 10000 ms

    # VideoJS - Extend plugin zoom #4
    # PLUGIN settings
    #
    plugins:

      zoomButtons:

        # Gestures settimgs
        #
        gestures:
          # VideoJS - Extend plugin zoom #5
          # This key is now the one and only MASTER switch read by the zoom
          # plugin (resolved in zoom.js, _resolveGestureMaster). Default: false.
          #
          # MASTER switch of the gesture layer (pan, pinch, wheel, double tap).
          # If set to false: no zoom gesture enabled for native (mp4) video.
          #
          enabled:                      true

          # Gesture layer settings for pan, pinch, wheel, tap etc.
          # be added here with the meaning documented in videojs.yml.
          #
          #doubleTap:                    none                                   # settings: none | zoom

# ------------------------------------------------------------------------------
# END config