          hotKeys:
            enabled:                    true

          playlist:
            enabled:                    true

    # --------------------------------------------------------------------------
    # Player 6 – Olivia Dean (Video)
    #
    - player:

      # GENERAL settings
      #
      enabled:                          true
      id:                               player_olivia_dean_video
      description:                      Olivia Dean - The Art Of Loving

      # PLAYLIST settings
      #
      playlist:
        preload:                        [ ytp-olivia-dean--the-art-of-loving.json ]
